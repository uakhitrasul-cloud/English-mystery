 \u2014 the diamond had [disappeared] without a sound.'\n    ],\n    mail:'Detective, the diamond was last seen in the case at 7:30. Only three people have [access] to it: myself, my assistant Emily and our [guard], Daniel. According to the security system, the [side door] was opened at 8:17. I need you to find the [thief] before the press finds out. \u2014 Alexander',\n    notes:['Last seen at <b>7:30<\/b>','Doors opened at <b>8:00<\/b>','Side door opened at <b>8:17<\/b>','Theft discovered at <b>8:20<\/b>','Access: <b>Alexander, Emily, Daniel<\/b>'],\n    talk:{\n      alexander:'I had been in the main hall since eight. I was giving a [speech], so dozens of [guests] can confirm where I was. I only went to the case at 8:20.',\n      emily:'Around 8:10 I went to the [office] to fetch a display [label]. I was there until 8:25, I promise. I hadn\u2019t been near the side door all evening.',\n      daniel:'I\u2019d checked the [main entrance] first, so I didn\u2019t reach the side door until about 8:18. By then someone in a [navy] [jacket] was [rushing] into the [garden].'\n    },\n    q:{\n      brief:[\n        {type:'choice', p:'When was the diamond last seen?', o:['At 7:30','At 8:00','At 8:17','At 8:20'], a:0, ex:'\u201cThe diamond was last seen in the case at 7:30.\u201d'},\n        {type:'choice', p:'Which detail suggests the thief knew the building well?', o:['The thief left through the side door, not the main entrance','The guests were in the main hall','The press may find out','The doors opened at 8:00'], a:0, ex:'Using a side door that guests don\u2019t know about suggests someone from inside the museum.'},\n        {type:'tf', p:'Alexander discovered the theft before the guests arrived.', a:false, ex:'False. The doors had opened at 8:00 and he found the empty case at 8:20 \u2014 the guests were already inside.'}\n      ],\n      talk:[\n        {type:'choice', p:'Emily said, \u201cI am in the office.\u201d \u2192 Emily said that she ___ in the office.', o:['was','is','has been','will be'], a:0, ex:'Reported speech: present simple moves one step back \u2192 <b>was<\/b>.'},\n        {type:'choice', p:'Whose alibi can be confirmed by independent witnesses?', o:['Alexander\u2019s','Emily\u2019s','Daniel\u2019s','Nobody\u2019s'], a:0, ex:'Dozens of guests saw Alexander giving a speech \u2014 an <b>alibi<\/b> confirmed by <b>witnesses<\/b>.'},\n        {type:'order', p:'Report Daniel\u2019s words.', w:['Daniel','claimed','that','he','had','seen','someone','in','a','navy','jacket'], ex:'Reported speech with past perfect: \u201cDaniel claimed that he had seen someone in a navy jacket.\u201d'}\n      ],\n      duel:[\n        {type:'choice', p:'The side exit ___ with Emily\u2019s keycard at 8:17.', o:['was opened','opened','has opened','was opening'], a:0, ev:'keycard', ex:'The door didn\u2019t open itself \u2014 someone opened it \u2192 passive: <b>was opened<\/b>.'},\n        {type:'choice', p:'If Emily ___ in the office, her badge wouldn\u2019t have been found outside.', o:['had stayed','stayed','has stayed','would stay'], a:0, ev:'badge', ex:'Third conditional (an unreal past): <b>If + past perfect, would have + V3<\/b>.'},\n        {type:'choice', p:'The jacket, ___ was found in Emily\u2019s locker, had glass dust in its pocket.', o:['which','who','what','where'], a:0, ev:'jacket', ex:'Non-defining relative clause about a thing \u2192 <b>which<\/b> (never \u201cwhat\u201d).'},\n        {type:'choice', p:'Emily had been in contact with a collector ___ the exhibition opened.', o:['before','since','during','while'], a:0, ev:'collector', ex:'Past perfect + <b>before<\/b> shows which action came first.'},\n        {type:'choice', p:'By the time Daniel reached the side door, the thief ___.', o:['had already left','already left','has already left','was already leave'], a:0, ev:'patrol', ex:'\u201cBy the time\u2026\u201d + an earlier past action \u2192 past perfect: <b>had already left<\/b>.'},\n        {type:'choice', p:'The camera must ___ toward the entrance on purpose.', o:['have been turned','had been turned','be turn','turned'], a:0, ev:'camera', ex:'Deduction about the past, passive: <b>must have been + V3<\/b>.'}\n      ],\n      board:[\n        {type:'choice', p:'Which piece of evidence directly contradicts Emily\u2019s statement?', o:['Keycard Log','Collector Message','Camera Record','Patrol Log'], a:0, ex:'She claimed she was in the office until 8:25, but her keycard was used at the side exit at 8:17.'},\n        {type:'choice', p:'Which piece of evidence is NOT enough to prove guilt on its own?', o:['Collector Message','Keycard Log','Navy Jacket','Visitor Badge'], a:0, ex:'Writing to a collector shows a possible <b>motive<\/b>, but not that she actually stole anything.'}\n      ]\n    },\n    confession:'\u201cFine \u2014 I did it. A collector had offered me more money than I could earn in ten years. I turned the camera, used my keycard and slipped out through the side door. If Daniel hadn\u2019t checked the main entrance first, he would have caught me.\u201d \u2014 Emily'\n  }\n};\n\n/* =========================================================\n   STATE\n   ========================================================= */\nlet S = {\n  screen:'setup', level:'beginner', teamCount:2, teams:TEAM_DEFAULTS.slice(0,4).map(n=>({name:n,score:0,right:0})),\n  timerSec:30, lang:0, sound:true,\n  stage:0, qi:0, turn:0, evidence:[], suspectOpen:null, heard:{},\n  answered:false, attempt:null, stealing:false, tried:[], order:[],\n  accuse:{}, accuseTeam:0, revealed:false\n};\nconst $ = id => document.getElementById(id);\nconst esc = s => String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));\nconst L = () => LEVELS[S.level];\nconst teams = () => S.teams.slice(0,S.teamCount);\nconst tc = i => TEAM_COLORS[i];\n\n/* =========================================================\n   SOUND + SPEECH\n   ========================================================= */\nlet AC=null;\nfunction beep(type){\n  if(!S.sound) return;\n  try{\n    AC = AC || new (window.AudioContext||window.webkitAudioContext)();\n    const seq = {ok:[[523,.09],[659,.09],[784,.18]], bad:[[220,.18],[175,.25]], tick:[[880,.04]], ev:[[392,.08],[523,.08],[659,.08],[1046,.22]], drum:[[110,.12],[110,.12],[110,.12],[82,.4]]}[type]||[];\n    let t = AC.currentTime;\n    seq.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type==='drum'?'triangle':'sine';o.frequency.value=f;g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02);t+=d*.9;});\n  }catch(e){}\n}\nfunction speak(text,pitch=1){\n  try{\n    speechSynthesis.cancel();\n    const u = new SpeechSynthesisUtterance(text.replace(/\\[|\\]/g,''));\n    const v = speechSynthesis.getVoices().find(v=>/en-GB/i.test(v.lang)) || speechSynthesis.getVoices().find(v=>/^en/i.test(v.lang));\n    if(v) u.voice=v; u.lang='en-GB'; u.rate=S.level==='beginner'?.82:.95; u.pitch=pitch;\n    speechSynthesis.speak(u);\n  }catch(e){ toast('Speech is not available in this browser'); }\n}\ntry{ speechSynthesis.getVoices(); }catch(e){}\n\n/* =========================================================\n   PORTRAITS (inline SVG)\n   ========================================================= */\nfunction portrait(id){\n  const P = {\n    alexander:{bg:'#2a3350',skin:'#e7b78e',hair:'#c9cbd3',body:'#262b38',acc:'<rect x=\"56\" y=\"88\" width=\"8\" height=\"22\" fill=\"#e2be78\"/><circle cx=\"50\" cy=\"55\" r=\"7\" fill=\"none\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"70\" cy=\"55\" r=\"7\" fill=\"none\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"57\" y1=\"55\" x2=\"63\" y2=\"55\" stroke=\"#111\" stroke-width=\"2\"/>',hairShape:'<path d=\"M38 50 Q38 28 60 27 Q82 28 82 50 Q78 38 66 37 Q52 36 42 44 Z\" fill=\"#c9cbd3\"/>'},\n    emily:{bg:'#3a2a4d',skin:'#f1c7a2',hair:'#3b2417',body:'#1f3d70',acc:'<path d=\"M48 88 L60 104 L72 88\" fill=\"none\" stroke=\"#e8eefc\" stroke-width=\"3\"/>',hairBack:'<path d=\"M34 54 Q32 24 60 23 Q88 24 86 54 L90 96 Q74 90 60 90 Q46 90 30 96 Z\" fill=\"#3b2417\"/>',hairShape:'<path d=\"M38 52 Q40 27 60 27 Q80 27 82 52 Q74 36 56 38 Q46 40 38 52 Z\" fill=\"#3b2417\"/>'},\n    daniel:{bg:'#203646',skin:'#c48a5c',hair:'#1c1c1c',body:'#34465f',acc:'<circle cx=\"74\" cy=\"98\" r=\"4\" fill=\"#e2be78\"/>',hairShape:'<path d=\"M36 42 Q36 24 60 22 Q84 24 84 42 Z\" fill=\"#1d2738\"/><rect x=\"32\" y=\"40\" width=\"56\" height=\"6\" rx=\"3\" fill=\"#141b29\"/><circle cx=\"60\" cy=\"32\" r=\"4\" fill=\"#e2be78\"/>'}\n  }[id];\n  return `<svg viewBox=\"0 0 120 120\" aria-hidden=\"true\"><circle cx=\"60\" cy=\"60\" r=\"58\" fill=\"${P.bg}\"/>${P.hairBack||''}\n  <path d=\"M22 120 Q24 86 60 84 Q96 86 98 120 Z\" fill=\"${P.body}\"/>${P.acc.includes('rect x=\"56\"')?P.acc.split('<circle')[0]:''}\n  <rect x=\"53\" y=\"70\" width=\"14\" height=\"16\" rx=\"6\" fill=\"${P.skin}\"/>\n  <ellipse cx=\"60\" cy=\"54\" rx=\"21\" ry=\"24\" fill=\"${P.skin}\"/>\n  ${P.hairShape}\n  <circle cx=\"51\" cy=\"56\" r=\"2.6\" fill=\"#1b1406\"/><circle cx=\"69\" cy=\"56\" r=\"2.6\" fill=\"#1b1406\"/>\n  <path d=\"M53 67 Q60 71 67 67\" fill=\"none\" stroke=\"#7a3d2a\" stroke-width=\"2.2\" stroke-linecap=\"round\"/>\n  ${P.acc.includes('rect x=\"56\"')?'<circle'+P.acc.split('<circle').slice(1).join('<circle'):P.acc}\n  <\/svg>`;\n}\n\n/* =========================================================\n   TEXT HELPERS\n   ========================================================= */\nfunction glossify(text){\n  return esc(text).replace(/\\[(.+?)\\]/g,(m,w)=>{\n    const g = GLOSS[w.toLowerCase()];\n    return g ? `<span class=\"gw\" data-w=\"${esc(w)}\">${w}<\/span>` : w;\n  });\n}\nconst plain = t => t.replace(/\\[|\\]/g,'');\nfunction usedWords(){\n  const all = [ ...L().story, L().mail, ...Object.values(L().talk) ].join(' ');\n  const seen=[]; all.replace(/\\[(.+?)\\]/g,(m,w)=>{w=w.toLowerCase(); if(GLOSS[w]&&!seen.includes(w)) seen.push(w);});\n  return seen;\n}\n\n/* =========================================================\n   TIMER\n   ========================================================= */\nlet timerId=null, timeLeft=0;\nfunction startTimer(){\n  stopTimer();\n  if(!S.timerSec) return;\n  timeLeft=S.timerSec; drawTimer();\n  timerId=setInterval(()=>{\n    timeLeft--; if(timeLeft<=5 && timeLeft>0) beep('tick');\n    drawTimer();\n    if(timeLeft<=0){ stopTimer(); answer(null); }\n  },1000);\n}\nfunction stopTimer(){ clearInterval(timerId); timerId=null; }\nfunction drawTimer(){\n  const el=$('timer'); if(!el) return;\n  const p = Math.max(0,timeLeft/S.timerSec), C=2*Math.PI*31;\n  el.querySelector('.arc').setAttribute('stroke-dasharray',`${C*p} ${C}`);\n  el.querySelector('.num').textContent=timeLeft;\n  el.classList.toggle('low',timeLeft<=5);\n}\nfunction timerHtml(){\n  if(!S.timerSec) return '';\n  return `<div class=\"timer\" id=\"timer\"><svg width=\"74\" height=\"74\"><circle cx=\"37\" cy=\"37\" r=\"31\" stroke=\"rgba(255,255,255,.08)\" stroke-width=\"6\" fill=\"none\"/><circle class=\"arc\" cx=\"37\" cy=\"37\" r=\"31\" stroke=\"var(--gold)\" stroke-width=\"6\" fill=\"none\" stroke-linecap=\"round\"/><\/svg><div class=\"num\">${S.timerSec}<\/div><\/div>`;\n}\n\n/* =========================================================\n   RENDER: frame\n   ========================================================= */\nfunction topbar(){\n  return `<div class=\"topbar\">\n    <div class=\"brand\"><div class=\"logo\">\u25c6<\/div><div><h1 class=\"serif\">English Mystery<\/h1><small>Case #001 \u00b7 The Missing Diamond \u00b7 Class Mode \u00b7 ${L().label}<\/small><\/div><\/div>\n    <div class=\"tools\">\n      <button class=\"icon-btn ${S.lang===0?'on':''}\" data-a=\"lang\" title=\"Translation language\">${S.lang===0?'RU':'KZ'}<\/button>\n      <button class=\"icon-btn ${S.sound?'on':''}\" data-a=\"sound\" title=\"Sound\">${S.sound?'\ud83d\udd0a':'\ud83d\udd08'}<\/button>\n      <button class=\"icon-btn\" data-a=\"full\" title=\"Full screen\">\u26f6<\/button>\n      <button class=\"icon-btn\" data-a=\"home\" title=\"New game\">\u2302<\/button>\n    <\/div><\/div>`;\n}\nfunction scoreboard(){\n  return `<div class=\"scoreboard\" style=\"--n:${S.teamCount}\">${teams().map((t,i)=>`\n    <div class=\"team ${i===S.turn && S.screen==='game' && STAGES[S.stage].id!=='accuse'?'active':''}\" style=\"--c:${tc(i)}\" id=\"team${i}\">\n      <span class=\"name\">${esc(t.name)}<\/span><span class=\"plus\" id=\"plus${i}\"><\/span><span class=\"pts\">${t.score}<\/span>\n    <\/div>`).join('')}<\/div>`;\n}\nfunction track(){\n  return `<div class=\"track\">${STAGES.map((s,i)=>`<div class=\"step ${i<S.stage?'done':''} ${i===S.stage?'now':''}\"><span class=\"ic\">${i<S.stage?'\u2713':s.ic}<\/span><span class=\"lbl\">${s.t}<\/span><\/div>`).join('')}<\/div>`;\n}\nfunction sidePanel(){\n  const ev = EV_ORDER.map(id=>{const on=S.evidence.includes(id);return `<div class=\"it ${on?'':'lock'}\"><span>${on?EVIDENCE[id].ic:'\ud83d\udd12'}<\/span><span>${on?EVIDENCE[id].t:'Locked'}<\/span><\/div>`;}).join('');\n  return `<aside class=\"side\">\n    <div class=\"card\" style=\"margin-bottom:14px\"><h3 class=\"serif\">\ud83d\uddd2\ufe0f Case notes<\/h3><ul class=\"notes\" style=\"padding-left:18px;margin:0\">${L().notes.map(n=>`<li>${n}<\/li>`).join('')}<\/ul><\/div>\n    <div class=\"card\"><h3 class=\"serif\">\ud83e\uddfe Evidence ${S.evidence.length} / 6<\/h3><div class=\"mini-ev\">${ev}<\/div><\/div>\n    <p class=\"muted\" style=\"font-size:12px;margin-top:12px;line-height:1.6\">Keys: <kbd>1<\/kbd>\u2013<kbd>4<\/kbd> answer \u00b7 <kbd>Space<\/kbd> next \u00b7 <kbd>L<\/kbd> listen<\/p>\n  <\/aside>`;\n}\n\nfunction render(){\n  hideTip();\n  const app=$('app');\n  if(S.screen==='setup'){ app.innerHTML=setupHtml(); return; }\n  if(S.screen==='final'){ app.innerHTML=topbar()+finalHtml(); confetti(); return; }\n  const st=STAGES[S.stage];\n  let main='';\n  if(st.id==='accuse') main=accuseHtml();\n  else if(S.qi<0) main=introHtml(st);\n  else main=questionHtml(st);\n  app.innerHTML = topbar()+scoreboard()+track()+`<div class=\"stage\"><main class=\"card\">${main}<\/main>${sidePanel()}<\/div>`;\n  if(st.id!=='accuse' && S.qi>=0 && !S.answered) startTimer(); else stopTimer();\n}\n\n/* =========================================================\n   SETUP\n   ========================================================= */\nfunction setupHtml(){\n  return (window.top!==window?`<button class=\"btn btn-sm\" data-a=\"home\" style=\"margin-top:6px\">← Menu</button>`:'')+`<div class=\"hero\"><div class=\"kicker\">Case #001 \u00b7 The Missing Diamond<\/div>\n    <h1 class=\"serif\">ENGLISH<br><em>MYSTERY<\/em><\/h1><p>Class Mode \u00b7 Teams \u00b7 Think. Investigate. Solve.<\/p><\/div>\n  <div class=\"setup\">\n    <div class=\"card\">\n      <div class=\"field\"><label>Level<\/label><div class=\"seg\">\n        <button class=\"${S.level==='beginner'?'on':''}\" data-a=\"lvl\" data-v=\"beginner\">Beginner \u00b7 A1\u2013A2<\/button>\n        <button class=\"${S.level==='detective'?'on':''}\" data-a=\"lvl\" data-v=\"detective\">Detective \u00b7 B1\u2013B2<\/button><\/div><\/div>\n      <div class=\"field\"><label>Number of teams<\/label><div class=\"seg\">\n        ${[2,3,4].map(n=>`<button class=\"${S.teamCount===n?'on':''}\" data-a=\"tn\" data-v=\"${n}\">${n} teams<\/button>`).join('')}<\/div><\/div>\n      <div class=\"field\"><label>Team names<\/label><div class=\"team-inputs\">\n        ${teams().map((t,i)=>`<div class=\"ti\"><span class=\"sw\" style=\"background:${tc(i)}\"><\/span><input data-team=\"${i}\" value=\"${esc(t.name)}\" maxlength=\"22\"><\/div>`).join('')}<\/div><\/div>\n      <div class=\"field\"><label>Time per question<\/label><div class=\"seg\">\n        ${[[0,'No timer'],[20,'20 s'],[30,'30 s'],[45,'45 s']].map(([v,t])=>`<button class=\"${S.timerSec===v?'on':''}\" data-a=\"tm\" data-v=\"${v}\">${t}<\/button>`).join('')}<\/div><\/div>\n      <div class=\"field\"><label>Word translations<\/label><div class=\"seg\">\n        <button class=\"${S.lang===0?'on':''}\" data-a=\"lg\" data-v=\"0\">\u0420\u0443\u0441\u0441\u043a\u0438\u0439<\/button><button class=\"${S.lang===1?'on':''}\" data-a=\"lg\" data-v=\"1\">\u049a\u0430\u0437\u0430\u049b\u0448\u0430<\/button><\/div><\/div>\n      <button class=\"btn btn-gold\" style=\"width:100%;font-size:18px;padding:16px\" data-a=\"start\">Open the case \u2192<\/button>\n    <\/div>\n    <div class=\"card\">\n      <div class=\"kicker\" style=\"margin-bottom:8px\">How to play<\/div>\n      <ol class=\"how\" style=\"padding-left:20px;margin:0\">\n        <li>Teams answer <b>in turns<\/b>. The active team glows on the scoreboard.<\/li>\n        <li>Correct answer = <b>+10<\/b>. Wrong or out of time \u2192 the next team can <b>steal<\/b> for <b>+5<\/b>.<\/li>\n        <li>In the <b>Grammar Duel<\/b> every correct answer pins a new piece of <b>evidence<\/b> on the board.<\/li>\n        <li>Tap <b>gold words<\/b> to see the translation. Press <b>\ud83d\udd0a Listen<\/b> to hear the text.<\/li>\n        <li>At the end, every team names the <b>thief<\/b> (+30) and the <b>motive<\/b> (+10).<\/li>\n      <\/ol>\n      <div class=\"row\" style=\"margin-top:18px;justify-content:center\">${SUSPECTS.map(s=>`<div style=\"text-align:center;width:96px\"><div style=\"width:76px;margin:0 auto\">${portrait(s.id)}<\/div><div style=\"font-size:13px;font-weight:700;margin-top:4px\">${s.name}<\/div><div class=\"muted\" style=\"font-size:11px\">${s.role}<\/div><\/div>`).join('')}<\/div>\n      <p class=\"muted\" style=\"font-size:13px;text-align:center;margin-top:14px\">Best on a projector or interactive board \u00b7 25\u201335 minutes<\/p>\n    <\/div>\n  <\/div>`;\n}\n\n/* =========================================================\n   STAGE INTRO screens\n   ========================================================= */\nfunction introHtml(st){\n  let body='';\n  if(st.id==='brief'){\n    body = `<div class=\"story\">${L().story.map(p=>`<p>${glossify(p)}<\/p>`).join('')}<\/div>\n      <div class=\"email\"><div class=\"hd\"><b>From:<\/b> Alexander Hart \u00b7 <b>Subject:<\/b> Please help me<\/div>${glossify(L().mail)}<\/div>`;\n  } else if(st.id==='talk'){\n    const open=S.suspectOpen, idx=SUSPECTS.findIndex(s=>s.id===open);\n    body = `<div class=\"suspects\">${SUSPECTS.map(s=>`<button class=\"sus ${open===s.id?'sel':''}\" data-a=\"sus\" data-v=\"${s.id}\">${portrait(s.id)}<strong>${s.name}<\/strong><span>${s.role}<\/span>${S.heard[s.id]?'<span class=\"seen\">\u2713 interviewed<\/span>':''}<\/button>`).join('')}<\/div>\n      ${open?`<div class=\"bubble\" style=\"--x:${16.6+idx*33.3}%\"><div class=\"who\"><span>${SUSPECTS[idx].name} says\u2026<\/span><button data-a=\"say\" data-v=\"${open}\">\ud83d\udd0a Listen<\/button><\/div>${glossify(L().talk[open])}<\/div>`\n      :`<p class=\"muted\" style=\"font-size:18px\">\ud83d\udc46 Tap a suspect to hear their statement. Interview all three.<\/p>`}`;\n  } else if(st.id==='duel'){\n    body = `<p style=\"font-size:20px;line-height:1.6\">Six questions. Six pieces of evidence are locked in the police lab.<br>Each correct answer <b style=\"color:var(--gold)\">unlocks one<\/b> and pins it on the board.<\/p>${boardHtml()}`;\n  } else if(st.id==='board'){\n    body = `<p style=\"font-size:20px;line-height:1.6\">You unlocked <b style=\"color:var(--gold)\">${S.evidence.length} of 6<\/b> pieces of evidence. Look at the board together and talk: <i>who had the chance, the reason and the keys?<\/i><\/p>${boardHtml(true)}`;\n  }\n  const canGo = st.id!=='talk' || SUSPECTS.every(s=>S.heard[s.id]);\n  const listenBtn = st.id==='brief' ? `<button class=\"btn listen\" data-a=\"readall\">\ud83d\udd0a Listen<\/button>` : '';\n  return `<div class=\"q-head\"><div><div class=\"kicker\">Stage ${S.stage+1} \u00b7 ${st.t}<\/div><h2 class=\"serif\">${st.ic} ${st.t}<\/h2><p class=\"muted\" style=\"margin:6px 0 0\">${st.sub}<\/p><\/div><\/div>\n    ${body}\n    <div class=\"actions\">${listenBtn}<button class=\"btn btn-gold\" data-a=\"begin\" ${canGo?'':'disabled style=\"opacity:.45;cursor:not-allowed\"'}>${canGo?'Start the questions \u2192':'Interview everyone first'}<\/button><\/div>`;\n}\n\nfunction boardHtml(withStrings){\n  const rots=[-3,2,-1.5,3,-2.5,1.5];\n  const pins = EV_ORDER.map((id,i)=>{\n    const on=S.evidence.includes(id), e=EVIDENCE[id];\n    return `<div class=\"pin ${on?'':'locked'}\" style=\"--rot:${rots[i]}deg\" data-pin=\"${id}\"><div class=\"ico\">${on?e.ic:'\ud83d\udd12'}<\/div><h5>${on?e.t:'Locked'}<\/h5><p>${on?esc(e.d):'Win a duel question to unlock.'}<\/p><\/div>`;\n  }).join('');\n  return `<div class=\"board\" id=\"board\"><svg class=\"strings\" id=\"strings\"><\/svg><div class=\"board-grid\">${pins}<\/div><\/div>`;\n}\nfunction drawStrings(){\n  const svg=$('strings'), b=$('board'); if(!svg||!b) return;\n  const on=[...b.querySelectorAll('.pin:not(.locked)')]; const br=b.getBoundingClientRect();\n  const pts=on.map(p=>{const r=p.getBoundingClientRect();return [r.left-br.left+r.width/2, r.top-br.top+4];});\n  let d=''; for(let i=1;i<pts.length;i++) d+=`<line x1=\"${pts[i-1][0]}\" y1=\"${pts[i-1][1]}\" x2=\"${pts[i][0]}\" y2=\"${pts[i][1]}\" stroke=\"#d6333b\" stroke-width=\"2.5\" opacity=\".85\"/>`;\n  svg.innerHTML=d;\n}\n\n/* =========================================================\n   QUESTIONS\n   ========================================================= */\nfunction curQ(){ return L().q[STAGES[S.stage].id][S.qi]; }\nfunction qCount(){ return L().q[STAGES[S.stage].id].length; }\nfunction teamNow(){ return S.stealing ? (S.turn+1)%S.teamCount : S.turn; }\n\nfunction questionHtml(st){\n  const q=curQ(), t=teamNow();\n  const tag={choice:'Choose the answer',tf:'True or false?',order:'Put the words in order'}[q.type];\n  let body='';\n  if(q.type==='choice'||q.type==='tf'){\n    const opts = q.type==='tf'?['True','False']:q.o;\n    const right = q.type==='tf' ? (q.a?0:1) : q.a;\n    body = `<div class=\"options\">${opts.map((o,i)=>{\n      let cls=''; if(S.tried.includes(i)) cls='wrong'; if(S.answered && i===right) cls='right';\n      const dis = S.answered || S.tried.includes(i);\n      return `<button class=\"opt ${cls}\" data-a=\"opt\" data-v=\"${i}\" ${dis?'disabled':''}><span class=\"k\">${cls==='right'?'\u2713':cls==='wrong'?'\u2717':i+1}<\/span>${esc(o)}<\/button>`;}).join('')}<\/div>`;\n  } else {\n    const placed=S.order;\n    body = `<div class=\"answer-line\" id=\"aline\">${placed.map((wi,k)=>`<button class=\"tile\" data-a=\"unplace\" data-v=\"${k}\">${esc(S.shuffled[wi])}<\/button>`).join('')}<\/div>\n      <div class=\"tiles\">${S.shuffled.map((w,i)=>`<button class=\"tile ${placed.includes(i)?'used':''}\" data-a=\"place\" data-v=\"${i}\" ${S.answered?'disabled':''}>${esc(w)}<\/button>`).join('')}<\/div>\n      ${S.answered?'':`<div class=\"actions\" style=\"justify-content:flex-start\"><button class=\"btn btn-sm\" data-a=\"clear\">\u21ba Clear<\/button><button class=\"btn btn-gold btn-sm\" data-a=\"check\" ${placed.length===q.w.length?'':'disabled style=\"opacity:.45\"'}>Check<\/button><\/div>`}`;\n  }\n  const evLine = q.ev && !S.answered ? `<p class=\"muted\" style=\"margin:-6px 0 14px\">\ud83d\udd12 Prize: <b style=\"color:var(--gold)\">${EVIDENCE[q.ev].t}<\/b><\/p>`:'';\n  const prompt = esc(q.p).replace(/___/g,'<span class=\"blank\">?<\/span>');\n  return `<div class=\"q-head\"><div>\n      <div class=\"kicker\">Stage ${S.stage+1} \u00b7 ${st.t} \u00b7 Question ${S.qi+1} / ${qCount()}<\/div>\n      <div style=\"margin-top:10px\"><span class=\"turn-pill\" style=\"--c:${tc(t)}\"><span class=\"dot\"><\/span>${S.stealing?'STEAL! ':''}${esc(teams()[t].name)}<\/span><\/div>\n    <\/div>${S.answered?'':timerHtml()}<\/div>\n    <div class=\"type-tag\">${tag}<\/div>\n    <div class=\"prompt\">${prompt}<\/div>${evLine}\n    ${body}\n    ${feedbackHtml()}`;\n}\n\nfunction feedbackHtml(){\n  if(S.attempt==='steal-offer'){\n    const n=(S.turn+1)%S.teamCount;\n    return `<div class=\"banner steal\"><div class=\"big\">\u26a1<\/div><div><h4>Not quite! Steal chance for ${esc(teams()[n].name)}<\/h4><p>Try one of the remaining answers for <b>+5<\/b>.<\/p><\/div><\/div>`;\n  }\n  if(!S.answered) return '';\n  const q=curQ(), ok=S.attempt==='ok';\n  const ev = ok && q.ev ? `<p style=\"margin-top:8px\">\ud83d\udd13 New evidence unlocked: <b>${EVIDENCE[q.ev].ic} ${EVIDENCE[q.ev].t}<\/b><\/p>`:'';\n  const head = ok ? (S.lastWinner!=null?`Correct! +${S.lastPts} for ${esc(teams()[S.lastWinner].name)}`:'Correct!') : (S.attempt==='timeout'?'Time is up!':'No points this time');\n  const model = q.type==='order' ? `<p><b>Answer:<\/b> ${esc(q.w.join(' '))}<\/p>`:'';\n  const last = S.qi===qCount()-1;\n  return `<div class=\"banner ${ok?'ok':'bad'}\"><div class=\"big\">${ok?'\u2705':'\ud83d\udcd8'}<\/div><div><h4>${head}<\/h4>${model}<p>${q.ex}<\/p>${ev}<\/div><\/div>\n   <div class=\"actions\"><button class=\"btn btn-gold\" data-a=\"next\">${last?'Next stage \u2192':'Next question \u2192'}<\/button><\/div>`;\n}\n\nfunction prepQ(){\n  S.answered=false; S.attempt=null; S.stealing=false; S.tried=[]; S.order=[]; S.lastWinner=null;\n  const q=curQ(); if(q && q.type==='order'){ S.shuffled=shuffle(q.w.slice()); if(S.shuffled.join(' ')===q.w.join(' ')) S.shuffled.reverse(); }\n}\nfunction shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}\n\nfunction answer(choice){\n  if(S.answered) return;\n  stopTimer();\n  const q=curQ();\n  let ok=false;\n  if(choice!==null){\n    if(q.type==='order') ok = S.order.map(i=>S.shuffled[i]).join(' ')===q.w.join(' ');\n    else if(q.type==='tf') ok = (choice===0)===q.a;\n    else ok = choice===q.a;\n  }\n  if(ok){\n    const t=teamNow(), pts=S.stealing?5:10;\n    award(t,pts); S.lastWinner=t; S.lastPts=pts;\n    S.answered=true; S.attempt='ok';\n    if(q.ev && !S.evidence.includes(q.ev)){ S.evidence.push(q.ev); setTimeout(()=>beep('ev'),350); }\n    beep('ok'); burst();\n  } else {\n    beep('bad');\n    if(choice!==null && q.type!=='order') S.tried.push(choice);\n    const optsLeft = q.type==='tf'?0 : q.type==='order'?1 : (q.o.length-S.tried.length-1);\n    if(!S.stealing && S.teamCount>1 && optsLeft>0){\n      S.stealing=true; S.attempt='steal-offer';\n      if(q.type==='order') S.order=[];\n    } else { S.answered=true; S.attempt = choice===null?'timeout':'bad'; }\n  }\n  render();\n}\nfunction award(t,pts){\n  S.teams[t].score+=pts; S.teams[t].right++;\n  setTimeout(()=>{const p=$('plus'+t); if(p){p.textContent='+'+pts;p.classList.remove('show');void p.offsetWidth;p.classList.add('show');}},30);\n}\nfunction next(){\n  S.turn=(S.turn+1)%S.teamCount;\n  if(S.qi < qCount()-1){ S.qi++; prepQ(); }\n  else { S.stage++; S.qi=-1; S.suspectOpen=null; if(STAGES[S.stage].id==='accuse'){S.accuseTeam=0;S.accuse={};S.revealed=false;} }\n  render();\n}\n\n/* =========================================================\n   ACCUSATION\n   ========================================================= */\nfunction accuseHtml(){\n  if(S.revealed) return revealHtml();\n  const t=S.accuseTeam, cur=S.accuse[t]||{};\n  const done = teams().every((_,i)=>S.accuse[i]&&S.accuse[i].s&&S.accuse[i].m);\n  const votes = sid => teams().map((x,i)=>S.accuse[i]&&S.accuse[i].s===sid&&i!==t?`<i style=\"background:${tc(i)}\"><\/i>`:'').join('');\n  return `<div class=\"q-head\"><div><div class=\"kicker\">Stage 5 \u00b7 Accusation<\/div><h2 class=\"serif\">\u2696\ufe0f Who stole the diamond?<\/h2><p class=\"muted\" style=\"margin:6px 0 0\">Each team discusses for one minute, then chooses a suspect and a motive.<\/p><\/div><\/div>\n    <div class=\"row\">${teams().map((x,i)=>`<button class=\"turn-pill\" style=\"--c:${tc(i)};${i===t?'':'opacity:.5'}\" data-a=\"acct\" data-v=\"${i}\"><span class=\"dot\"><\/span>${esc(x.name)} ${S.accuse[i]&&S.accuse[i].s&&S.accuse[i].m?'\u2713':''}<\/button>`).join('')}<\/div>\n    <div class=\"acc-team\"><span class=\"turn-pill\" style=\"--c:${tc(t)}\"><span class=\"dot\"><\/span>${esc(teams()[t].name)}<\/span> chooses:<\/div>\n    <div class=\"suspects\">${SUSPECTS.map(s=>`<button class=\"sus ${cur.s===s.id?'sel':''}\" data-a=\"pick-s\" data-v=\"${s.id}\">${portrait(s.id)}<strong>${s.name}<\/strong><span>${s.role}<\/span><div class=\"votes\">${votes(s.id)}<\/div><\/button>`).join('')}<\/div>\n    <div class=\"type-tag\" style=\"margin:8px 0\">Motive \u2014 why did she / he do it?<\/div>\n    <div class=\"motives\">${MOTIVES.map(m=>`<button class=\"mot ${cur.m===m.id?'sel':''}\" data-a=\"pick-m\" data-v=\"${m.id}\">${esc(m.t)}<\/button>`).join('')}<\/div>\n    <div class=\"actions\">${cur.s&&cur.m&&!done?`<button class=\"btn btn-gold\" data-a=\"acc-next\">Next team \u2192<\/button>`:''}\n      ${done?`<button class=\"btn btn-gold\" data-a=\"reveal\">\ud83e\udd41 Reveal the truth<\/button>`:''}<\/div>`;\n}\nfunction revealHtml(){\n  const res = teams().map((x,i)=>{const a=S.accuse[i]||{};return {i,s:a.s==='emily',m:a.m==='collector'};});\n  return `<div class=\"reveal\"><div class=\"kicker\">The truth<\/div>\n    <div class=\"culprit\" style=\"margin-top:12px\">${portrait('emily')}<div class=\"stamp\">GUILTY<\/div><\/div>\n    <h2 class=\"serif\" style=\"font-size:34px;margin:8px 0 0\">Emily, the Museum Assistant<\/h2>\n    <p class=\"muted\">Motive: she planned to sell the diamond to a private collector.<\/p>\n    <div class=\"confession\">${esc(L().confession)}<\/div>\n    <div class=\"row\" style=\"justify-content:center;margin:16px 0 0\"><button class=\"btn btn-sm\" data-a=\"saytext\">\ud83d\udd0a Listen to the confession<\/button><\/div>\n    <div class=\"row\" style=\"justify-content:center;margin-top:18px\">${res.map(r=>`<div class=\"team\" style=\"--c:${tc(r.i)};min-width:200px\"><span class=\"name\">${esc(teams()[r.i].name)}<\/span><span>${r.s?'\u2713 thief +30':'\u2717 thief'} \u00b7 ${r.m?'\u2713 motive +10':'\u2717 motive'}<\/span><\/div>`).join('')}<\/div>\n    <div class=\"actions\" style=\"justify-content:center\"><button class=\"btn btn-gold\" data-a=\"final\">See the final results \u2192<\/button><\/div><\/div>`;\n}\n\n/* =========================================================\n   FINAL\n   ========================================================= */\nfunction finalHtml(){\n  const ranked = teams().map((t,i)=>({...t,i})).sort((a,b)=>b.score-a.score);\n  const order = ranked.length>=3 ? [ranked[1],ranked[0],ranked[2]] : [ranked[1],ranked[0]].filter(Boolean);\n  const max = Math.max(1,...ranked.map(r=>r.score));\n  const place = r => ranked.findIndex(x=>x.score===r.score);\n  const medal = r => ['\ud83e\udd47','\ud83e\udd48','\ud83e\udd49','\ud83c\udfc5'][place(r)];\n  const winners = ranked.filter(r=>r.score===ranked[0].score).map(r=>esc(r.name)).join(' & ');\n  const rest = ranked.slice(3);\n  return `<div class=\"hero\" style=\"padding-top:6px\"><div class=\"kicker\">Case closed<\/div><h1 class=\"serif\" style=\"font-size:clamp(34px,6vw,52px)\"><em>${winners}<\/em><\/h1><p>${winners.includes('&')?'A draw! Best detectives of the day':'Best detectives of the day'}<\/p><\/div>\n    <div class=\"podium\">${order.map(r=>`<div class=\"pod\" style=\"--c:${tc(r.i)}\"><div class=\"medal\">${medal(r)}<\/div><div class=\"nm\">${esc(r.name)}<\/div><div class=\"bar\" style=\"height:${60+150*r.score/max}px\">${r.score}<\/div><\/div>`).join('')}<\/div>\n    ${rest.length?`<p class=\"muted\" style=\"text-align:center\">${rest.map(r=>`${medal(r)} ${esc(r.name)} \u2014 ${r.score}`).join(' \u00b7 ')}<\/p>`:''}\n    <div class=\"card\" style=\"margin-top:18px\"><div class=\"kicker\" style=\"margin-bottom:10px\">Words of the case \u00b7 ${S.lang===0?'\u0420\u0443\u0441\u0441\u043a\u0438\u0439':'\u049a\u0430\u0437\u0430\u049b\u0448\u0430'}<\/div>\n      <div class=\"words\">${usedWords().map(w=>`<div class=\"word\"><b>${w}<\/b><span>${GLOSS[w][S.lang]}<\/span><\/div>`).join('')}<\/div><\/div>\n    <div class=\"actions\" style=\"justify-content:center;margin-top:20px\"><button class=\"btn\" data-a=\"home\">Change teams<\/button><button class=\"btn btn-gold\" data-a=\"again\">Play again<\/button><\/div>`;\n}\n\n/* =========================================================\n   FX\n   ========================================================= */\nlet toastT;\nfunction toast(m){ let t=document.querySelector('.toast'); if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t);} t.textContent=m; clearTimeout(toastT); toastT=setTimeout(()=>t.remove(),2200); }\nfunction confetti(n=160){\n  const c=$('confetti'), x=c.getContext('2d'); c.width=innerWidth; c.height=innerHeight;\n  const cols=['#e2be78','#ff6b6b','#4dabf7','#51cf66','#cc5de8','#fff'];\n  const P=Array.from({length:n},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,r:4+Math.random()*5,c:cols[Math.random()*cols.length|0],a:Math.random()*6}));\n  let f=0; (function loop(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/2,p.r,p.r*.6);x.restore();}); if(++f<240) requestAnimationFrame(loop); else x.clearRect(0,0,c.width,c.height);})();\n}\nfunction burst(){ confetti(50); }\n\n/* tooltip for glossary words */\nfunction showTip(el){\n  const w=el.dataset.w.toLowerCase(), g=GLOSS[w]; if(!g) return;\n  const tip=$('tip'); tip.innerHTML=`<b>${esc(el.dataset.w)}<\/b><span>${g[S.lang]}<\/span>`; tip.classList.remove('hidden');\n  const r=el.getBoundingClientRect(); const tw=tip.offsetWidth;\n  tip.style.left=Math.max(8,Math.min(innerWidth-tw-8,r.left+r.width/2-tw/2))+'px'; tip.style.top=(r.top-tip.offsetHeight-10)+'px';\n  document.querySelectorAll('.gw.open').forEach(x=>x.classList.remove('open')); el.classList.add('open');\n}\nfunction hideTip(){ $('tip').classList.add('hidden'); document.querySelectorAll('.gw.open').forEach(x=>x.classList.remove('open')); }\n\n/* =========================================================\n   EVENTS\n   ========================================================= */\ndocument.addEventListener('mouseover',e=>{const g=e.target.closest('.gw'); if(g) showTip(g);});\ndocument.addEventListener('mouseout',e=>{if(e.target.closest('.gw')) hideTip();});\naddEventListener('scroll',hideTip,{passive:true});\ndocument.addEventListener('input',e=>{ if(e.target.dataset.team!=null){ S.teams[+e.target.dataset.team].name=e.target.value||TEAM_DEFAULTS[+e.target.dataset.team]; } });\n\ndocument.addEventListener('click',e=>{\n  const g=e.target.closest('.gw'); if(g){ showTip(g); speak(g.dataset.w); return; }\n  const b=e.target.closest('[data-a]'); if(!b) return;\n  const a=b.dataset.a, v=b.dataset.v;\n  const q = S.screen==='game' && S.qi>=0 && STAGES[S.stage].id!=='accuse' ? curQ() : null;\n  switch(a){\n    case 'lvl': S.level=v; render(); break;\n    case 'tn': S.teamCount=+v; render(); break;\n    case 'tm': S.timerSec=+v; render(); break;\n    case 'lg': S.lang=+v; render(); break;\n    case 'lang': S.lang=1-S.lang; render(); toast(S.lang?'\u0410\u0443\u0434\u0430\u0440\u043c\u0430: \u049b\u0430\u0437\u0430\u049b\u0448\u0430':'\u041f\u0435\u0440\u0435\u0432\u043e\u0434: \u0440\u0443\u0441\u0441\u043a\u0438\u0439'); break;\n    case 'sound': S.sound=!S.sound; render(); break;\n    case 'full': try{ document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>toast('Full screen is blocked here')); }catch(err){toast('Full screen is blocked here');} break;\n    case 'home': stopTimer(); try{speechSynthesis.cancel();}catch(_){} if(S.screen==='setup' && window.top!==window){ try{ window.top.location.href=window.top.location.pathname; }catch(e){} return; } S.screen='setup'; render(); break;\n    case 'start': case 'again': startGame(); break;\n    case 'readall': speak(L().story.join(' ')+' '+L().mail); break;\n    case 'sus': S.suspectOpen=v; S.heard[v]=true; render(); speak(L().talk[v], SUSPECTS.find(s=>s.id===v).pitch); break;\n    case 'say': speak(L().talk[v], SUSPECTS.find(s=>s.id===v).pitch); break;\n    case 'saytext': speak(L().confession, 1.25); break;\n    case 'begin': if(b.disabled) return; try{speechSynthesis.cancel();}catch(_){} S.qi=0; prepQ(); render(); break;\n    case 'opt': answer(+v); break;\n    case 'place': if(!S.order.includes(+v)){S.order.push(+v); render();} break;\n    case 'unplace': S.order.splice(+v,1); render(); break;\n    case 'clear': S.order=[]; render(); break;\n    case 'check': if(q && S.order.length===q.w.length) answer(0); break;\n    case 'next': next(); break;\n    case 'acct': S.accuseTeam=+v; render(); break;\n    case 'pick-s': (S.accuse[S.accuseTeam]=S.accuse[S.accuseTeam]||{}).s=v; render(); break;\n    case 'pick-m': (S.accuse[S.accuseTeam]=S.accuse[S.accuseTeam]||{}).m=v; render(); break;\n    case 'acc-next': { const nxt=teams().findIndex((_,i)=>!(S.accuse[i]&&S.accuse[i].s&&S.accuse[i].m)); S.accuseTeam=nxt<0?S.accuseTeam:nxt; render(); break; }\n    case 'reveal': beep('drum'); setTimeout(()=>{ teams().forEach((_,i)=>{const r=S.accuse[i]; let p=0; if(r.s==='emily')p+=30; if(r.m==='collector')p+=10; if(p){S.teams[i].score+=p;}}); S.revealed=true; render(); confetti(); beep('ok'); },900); break;\n    case 'final': S.screen='final'; render(); break;\n  }\n  if(document.getElementById('board')) setTimeout(drawStrings,520);\n});\naddEventListener('resize',()=>{ if($('board')) drawStrings(); });\ndocument.addEventListener('keyup',()=>{ if($('board')) setTimeout(drawStrings,520); });\n\ndocument.addEventListener('keydown',e=>{\n  if(e.target.tagName==='INPUT') return;\n  if(S.screen!=='game') return;\n  const st=STAGES[S.stage];\n  if(/^[1-4]$/.test(e.key) && S.qi>=0 && st.id!=='accuse' && !S.answered){\n    const q=curQ(); if(q.type==='order') return;\n    const i=+e.key-1, n=q.type==='tf'?2:q.o.length; if(i<n && !S.tried.includes(i)) answer(i);\n  } else if(e.key===' '||e.key==='Enter'){\n    e.preventDefault();\n    if(S.answered) next(); else if(S.qi<0 && st.id!=='accuse'){ const btn=document.querySelector('[data-a=\"begin\"]'); if(btn && !btn.disabled) btn.click(); }\n  } else if(e.key.toLowerCase()==='l'){\n    if(st.id==='brief'&&S.qi<0) speak(L().story.join(' ')+' '+L().mail);\n    else if(st.id==='talk'&&S.suspectOpen) speak(L().talk[S.suspectOpen]);\n    else if(S.qi>=0 && st.id!=='accuse') speak(plain(curQ().p).replace(/___/g,'blank'));\n  }\n});\n\nfunction startGame(){\n  S.teams.forEach(t=>{t.score=0;t.right=0;});\n  Object.assign(S,{screen:'game',stage:0,qi:-1,turn:0,evidence:[],suspectOpen:null,heard:{},accuse:{},accuseTeam:0,revealed:false});\n  render();\n}\nrender();\n<\/script>\n<\/body>\n<\/html>\n";
function openTeams(){
  document.body.innerHTML='';
  const f=document.createElement('iframe');
  f.setAttribute('allow','fullscreen; autoplay'); f.setAttribute('allowfullscreen','');
  f.style.cssText='position:fixed;inset:0;width:100%;height:100%;border:0;background:#070b16';
  f.srcdoc=CLASS_MODE_HTML; document.body.appendChild(f); document.title='English Mystery — Class Mode';
}
/* boot */
if(params.get('teams')!==null) openTeams();
else if(params.get('join')!==null) Player.joinScreen();
else if(params.get('host')!==null) Host.setup();
else startScreen();
</script>
