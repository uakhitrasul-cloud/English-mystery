<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>English Mystery — Battle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#070b16;--line:rgba(226,190,120,.18);--gold:#e2be78;--text:#eef1f7;--muted:#9aa6bd;--ok:#3ccf91;--bad:#ff6b6b;
  --a0:#e5484d;--a1:#3e8ef7;--a2:#f5a524;--a3:#2fbf71;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
body{background:radial-gradient(1200px 600px at 15% -10%,rgba(226,190,120,.10),transparent 60%),radial-gradient(900px 500px at 110% 10%,rgba(62,142,247,.08),transparent 60%),var(--bg);min-height:100vh}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.serif{font-family:Fraunces,Georgia,serif}
.wrap{max-width:1240px;margin:0 auto;padding:18px}
.kicker{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:700}
.muted{color:var(--muted)}
.card{background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.012));border:1px solid var(--line);border-radius:var(--r);padding:22px}
.btn{border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:999px;padding:12px 22px;font-weight:700;transition:.15s}
.btn:hover{border-color:var(--gold)}
.btn-gold{background:linear-gradient(180deg,#f0d394,#c99a4b);color:#1a1206;border:none;box-shadow:0 8px 24px rgba(226,190,120,.25)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.hidden{display:none!important}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{border-radius:12px;padding:10px 14px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.03);font-weight:600}
.seg button.on{border-color:var(--gold);background:rgba(226,190,120,.14);color:var(--gold)}
label.lb{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:14px 0 8px;letter-spacing:.08em;text-transform:uppercase}
input.txt{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:14px 16px;font-size:20px;outline:none}
input.txt:focus{border-color:var(--gold)}
.hero h1{font-size:clamp(40px,7vw,76px);margin:6px 0 0;line-height:.95}
.hero h1 em{font-style:normal;background:linear-gradient(180deg,#f3d9a2,#b8893f);-webkit-background-clip:text;background-clip:text;color:transparent}

/* ---------- start ---------- */
.choose{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-top:22px}
@media (max-width:860px){.choose{grid-template-columns:1fr}}
a.card{color:inherit;text-decoration:none}
.choose .card{cursor:pointer;transition:.15s;text-align:left}
.choose .card:hover{border-color:var(--gold);transform:translateY(-2px)}
.choose .big{font-size:42px}
.choose h3{margin:8px 0 6px;font-size:24px}

/* ---------- host ---------- */
.hbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.code-pill{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:8px 14px;background:rgba(255,255,255,.03)}
.code-pill b{font-family:Fraunces,serif;font-size:24px;letter-spacing:.12em;color:var(--gold)}
.lobby{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}
@media (max-width:900px){.lobby{grid-template-columns:1fr}}
.join-box{text-align:center}
.join-box .code{font-family:Fraunces,serif;font-size:clamp(64px,10vw,120px);font-weight:800;letter-spacing:.12em;line-height:1;color:var(--gold);margin:8px 0}
.join-box .url{font-size:18px;word-break:break-all}
#qr{display:inline-block;background:#fff;padding:12px;border-radius:16px;margin-top:14px}
#qr img,#qr canvas{display:block;width:200px!important;height:200px!important}
.chips{display:flex;flex-wrap:wrap;gap:10px;min-height:60px;align-content:flex-start}
.chip{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);font-weight:700;font-size:17px;animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
.chip .av{font-size:22px}
.chip.off{opacity:.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.count{font-family:Fraunces,serif;font-size:44px;font-weight:800}

.qhost{display:grid;grid-template-columns:1fr 280px;gap:16px}
@media (max-width:900px){.qhost{grid-template-columns:1fr}}
.qtext{font-size:clamp(26px,3.4vw,44px);line-height:1.3;margin:12px 0 22px;font-weight:700}
.qtext .blank{display:inline-block;min-width:110px;border-bottom:4px dashed var(--gold);text-align:center;color:var(--gold)}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ans{display:flex;align-items:center;gap:14px;border-radius:16px;padding:20px;font-size:clamp(18px,2vw,26px);font-weight:800;color:#fff;background:var(--c);min-height:86px;position:relative;overflow:hidden;border:none;text-align:left}
.ans .sh{font-size:26px;opacity:.9;width:30px;text-align:center}
.ans.dim{opacity:.25}
.ans.right{box-shadow:0 0 0 4px #fff inset}
.ans .cnt{margin-left:auto;font-family:Fraunces,serif;font-size:28px}
.ans .barfill{position:absolute;left:0;bottom:0;height:6px;background:rgba(255,255,255,.6);width:var(--w,0%);transition:width .6s}
.side-stat{display:flex;flex-direction:column;gap:14px}
.ring{position:relative;width:150px;height:150px;margin:0 auto}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-family:Fraunces,serif;font-size:52px;font-weight:800}
.ring.low .num{color:var(--bad)}
.answered{text-align:center}
.answered .count{color:var(--gold)}
.lb-list{display:flex;flex-direction:column;gap:8px}
.lb-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:14px;background:rgba(255,255,255,.05);font-size:20px;font-weight:700;transition:transform .5s}
.lb-row .pos{width:32px;color:var(--muted);font-family:Fraunces,serif}
.lb-row .av{font-size:26px}
.lb-row .sc{margin-left:auto;font-family:Fraunces,serif;font-size:24px;display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}
.lb-row .gain{font-size:13px;color:var(--ok);font-family:Inter}
.lb-row .streak{font-size:14px;color:#ffb44d}
.lb-row.top1{background:linear-gradient(90deg,rgba(226,190,120,.28),rgba(226,190,120,.06));border:1px solid var(--line)}
.explain{border-radius:14px;padding:14px 16px;background:rgba(60,207,145,.1);border:1px solid rgba(60,207,145,.35);font-size:18px;line-height:1.5;margin-top:14px}
.ev-line{margin-top:10px;font-size:18px;font-weight:700}
.story{font-family:Fraunces,serif;font-size:clamp(20px,2.2vw,28px);line-height:1.6}
.email{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:rgba(255,255,255,.03);font-size:clamp(16px,1.7vw,21px);line-height:1.6;margin-top:12px}
.gw{border-bottom:2px dotted var(--gold);color:#fff2d6;cursor:help}
.tip{position:fixed;z-index:50;background:#fff7e6;color:#1b1406;border-radius:12px;padding:10px 14px;font-size:15px;box-shadow:0 12px 30px rgba(0,0,0,.4);pointer-events:none;max-width:260px}
.tip b{display:block}
.sus3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:700px){.sus3{grid-template-columns:1fr}}
.susc{border-radius:16px;padding:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)}
.susc .hd{display:flex;gap:12px;align-items:center;margin-bottom:8px}
.susc svg{width:64px;height:64px;flex:none}
.susc p{margin:0;font-family:Fraunces,serif;font-size:18px;line-height:1.5;color:#f1e6cf}
.board{border-radius:18px;padding:20px;background:radial-gradient(circle at 20% 30%,rgba(0,0,0,.18) 0 2px,transparent 3px) 0 0/22px 22px,linear-gradient(135deg,#8a5a34,#6e4526);box-shadow:inset 0 0 0 10px #4a2e19}
.board-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.pin{position:relative;background:#fbf6ea;color:#2a1f10;border-radius:4px;padding:16px 12px 12px;box-shadow:0 10px 18px rgba(0,0,0,.35);transform:rotate(var(--rot,0deg))}
.pin::before{content:"";position:absolute;top:-8px;left:50%;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff8a8a,#c0262d)}
.pin h5{margin:4px 0;font-family:Fraunces,serif;font-size:15px}
.pin p{margin:0;font-size:13px;color:#4a3a22}
.pin.locked{background:rgba(255,255,255,.12);color:rgba(255,255,255,.7);box-shadow:none;border:2px dashed rgba(255,255,255,.35)}
.pin.locked p{color:rgba(255,255,255,.6)}
.stagehead h2{font-size:clamp(30px,4vw,48px);margin:6px 0 4px}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:16px;margin:26px 0}
.pod{width:190px;text-align:center}
.pod .bar{border-radius:14px 14px 0 0;background:linear-gradient(180deg,rgba(226,190,120,.35),rgba(226,190,120,.08));border:2px solid var(--gold);display:grid;place-items:center;font-family:Fraunces,serif;font-size:30px;font-weight:800;animation:grow .8s ease-out both}
.pod .av{font-size:54px}
.pod .nm{font-weight:800;font-size:20px;margin-bottom:8px}
@keyframes grow{from{transform:scaleY(0);transform-origin:bottom}}
.verdict{text-align:center}
.verdict .pt{position:relative;display:inline-block}
.verdict svg{width:170px;height:170px}
.stamp{position:absolute;left:50%;top:80%;transform:translate(-50%,-50%) rotate(-14deg);border:5px solid var(--bad);color:var(--bad);font-family:Fraunces,serif;font-weight:800;font-size:38px;padding:2px 14px;border-radius:10px;background:rgba(7,11,22,.6);animation:stamp .5s cubic-bezier(.2,1.8,.4,1) .4s both}
@keyframes stamp{from{opacity:0;transform:translate(-50%,-50%) rotate(-14deg) scale(2.4)}}
.vote-bars{display:grid;gap:10px;max-width:620px;margin:16px auto 0}
.vb{display:flex;align-items:center;gap:12px}
.vb .nm{width:110px;text-align:right;font-weight:700}
.vb .tr{flex:1;height:30px;border-radius:8px;background:rgba(255,255,255,.06);overflow:hidden}
.vb .fl{height:100%;background:var(--gold);width:var(--w);transition:width .8s}
.vb.guilty .fl{background:var(--bad)}
.hostnext{position:fixed;right:22px;bottom:22px;z-index:20}

/* ---------- player (phone) ---------- */
.ph{max-width:520px;margin:0 auto;padding:16px;min-height:100vh;display:flex;flex-direction:column}
.ph-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
.me{display:flex;align-items:center;gap:8px;font-weight:800}
.me .av{font-size:26px}
.score-pill{border-radius:999px;padding:6px 14px;background:rgba(255,255,255,.07);font-weight:800;font-family:Fraunces,serif;font-size:20px}
.avs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.avs button{font-size:30px;padding:8px 0;border-radius:12px;border:2px solid transparent;background:rgba(255,255,255,.05)}
.avs button.on{border-color:var(--gold);background:rgba(226,190,120,.15)}
.center{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center}
.center .big{font-size:72px;line-height:1}
.center h2{font-size:30px;margin:12px 0 6px}
.pq{font-size:22px;font-weight:700;line-height:1.35;margin:4px 0 16px}
.pq .blank{display:inline-block;min-width:70px;border-bottom:3px dashed var(--gold)}
.pans{display:grid;gap:10px;flex:1;align-content:start}
.pans.grid2{grid-template-columns:1fr 1fr}
.pbtn{border:none;border-radius:16px;min-height:84px;padding:14px;color:#fff;font-weight:800;font-size:19px;background:var(--c);display:flex;align-items:center;gap:10px;text-align:left;box-shadow:0 5px 0 rgba(0,0,0,.25);transition:transform .08s}
.pbtn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.pbtn .sh{font-size:22px}
.pbar{height:6px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;margin-bottom:14px}
.pbar i{display:block;height:100%;background:var(--gold);width:100%;transition:width 1s linear}
.res{border-radius:24px;padding:28px 18px;margin:auto 0}
.res.ok{background:linear-gradient(180deg,rgba(60,207,145,.25),rgba(60,207,145,.06))}
.res.bad{background:linear-gradient(180deg,rgba(255,107,107,.22),rgba(255,107,107,.05))}
.res .pts{font-family:Fraunces,serif;font-size:46px;font-weight:800}
.res .rk{margin-top:10px;font-size:18px;font-weight:700}
.res .ex{margin-top:14px;font-size:15px;line-height:1.5;color:#d5dbe7;text-align:left;background:rgba(0,0,0,.2);border-radius:12px;padding:12px}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{border-radius:12px;padding:12px 14px;font-size:18px;font-weight:700;background:#1b2747;border:1px solid rgba(255,255,255,.12)}
.tile.used{visibility:hidden}
.aline{border:2px dashed var(--line);border-radius:14px;padding:10px;min-height:64px;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;justify-content:center;align-items:center}
.aline:empty::before{content:"Tap the words in order…";color:var(--muted)}
.psus{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.psus button{border-radius:14px;padding:8px 4px;border:2px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);font-weight:700;font-size:14px}
.psus button.on{border-color:var(--gold);background:rgba(226,190,120,.12)}
.psus svg{width:64px;height:64px;display:block;margin:0 auto 4px}
.pmot{display:grid;gap:8px;margin-top:12px}
.pmot button{border-radius:12px;padding:12px;text-align:left;border:2px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);font-size:15px}
.pmot button.on{border-color:var(--gold);background:rgba(226,190,120,.12)}
.ptext{font-family:Fraunces,serif;font-size:19px;line-height:1.6;text-align:left}
.conn{position:fixed;left:50%;top:10px;transform:translateX(-50%);background:#ff6b6b;color:#200;padding:6px 14px;border-radius:999px;font-weight:700;font-size:13px;z-index:80}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#fff7e6;color:#1b1406;padding:12px 18px;border-radius:999px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.4);z-index:70}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
.err{color:var(--bad);font-weight:600;margin-top:10px;min-height:22px}
kbd{font-size:12px;border:1px solid rgba(255,255,255,.25);border-bottom-width:2px;border-radius:6px;padding:1px 6px}
</style>
</head>
<body>
<div id="app"></div>
<div id="tip" class="tip hidden"></div>
<canvas id="confetti" class="confetti"></canvas>
<script>
'use strict';
const TEAM_COLORS = ['var(--t0)','var(--t1)','var(--t2)','var(--t3)'];
const TEAM_DEFAULTS = ['Red Foxes','Blue Owls','Green Wolves','Purple Cats'];
const STAGES = [
  {id:'brief', ic:'📂', t:'Briefing', sub:'Read the case file. Tap gold words to see the translation.'},
  {id:'talk',  ic:'🗣️', t:'Interrogation', sub:'Listen to every suspect. Not every answer is true.'},
  {id:'duel',  ic:'⚔️', t:'Grammar Duel', sub:'Every correct answer unlocks a piece of evidence.'},
  {id:'board', ic:'📌', t:'Evidence Board', sub:'Connect the clues. Which evidence really matters?'},
  {id:'accuse',ic:'⚖️', t:'Accusation', sub:'Each team names the thief and the motive.'}
];

// Glossary: word -> [ru, kz]
const GLOSS = {
  'diamond':['бриллиант','гауһар'], 'exhibition':['выставка','көрме'], 'museum':['музей','мұражай'],
  'display case':['витрина','витрина'], 'empty':['пустой','бос'], 'gone':['исчез','жоқ болып кетті'],
  'thief':['вор','ұры'], 'keys':['ключи','кілттер'], 'side door':['боковая дверь','бүйір есік'],
  'suspect':['подозреваемый','күдікті'], 'evidence':['улики, доказательства','айғақ, дәлел'],
  'guard':['охранник','күзетші'], 'speech':['речь','сөз сөйлеу'], 'guests':['гости','қонақтар'],
  'office':['офис, кабинет','кеңсе'], 'label':['этикетка, табличка','жапсырма, белгі'],
  'navy':['тёмно-синий','қою көк'], 'jacket':['куртка','күртке'], 'garden':['сад','бақ'],
  'main entrance':['главный вход','басты кіреберіс'], 'keycard':['ключ-карта','кілт-карта'],
  'locker':['шкафчик','жеке шкаф'], 'collector':['коллекционер','коллекционер'],
  'badge':['бейдж','бейдж'], 'glass dust':['стеклянная пыль','шыны шаңы'], 'motive':['мотив','себеп, мотив'],
  'alibi':['алиби','алиби'], 'witness':['свидетель','куәгер'], 'claimed':['утверждал(а)','мәлімдеді'],
  'confirmed':['подтвердили','растады'], 'unveil':['представить, открыть','таныстыру, ашу'],
  'disappeared':['исчез','жоғалып кетті'], 'access':['доступ','кіру мүмкіндігі'],
  'insisted':['настаивал(а)','табанды түрде айтты'], 'rushing':['спешащий, бегущий','асығып жүгірген']
};

const EVIDENCE = {
  keycard:{ic:'💳', t:'Keycard Log', d:'Emily’s staff keycard opened the side exit at 8:17.'},
  badge:{ic:'🪪', t:'Visitor Badge', d:'Emily’s badge was found on the ground just outside the side exit.'},
  jacket:{ic:'🧥', t:'Navy Jacket', d:'A navy jacket with glass dust in the pocket was in Emily’s locker.'},
  collector:{ic:'✉️', t:'Collector Message', d:'Emily wrote to a private collector about “a rare stone” last week.'},
  patrol:{ic:'🔦', t:'Patrol Log', d:'Daniel checked the main entrance first and reached the side door at 8:18.'},
  camera:{ic:'📹', t:'Camera Record', d:'The hall camera was turned toward the entrance, not the display case.'}
};
const EV_ORDER = ['keycard','badge','jacket','collector','patrol','camera'];

const SUSPECTS = [
  {id:'alexander', name:'Alexander', role:'Museum Director', pitch:.85},
  {id:'emily', name:'Emily', role:'Museum Assistant', pitch:1.25},
  {id:'daniel', name:'Daniel', role:'Security Guard', pitch:.7}
];
const MOTIVES = [
  {id:'collector', t:'She planned to sell the diamond to a private collector.'},
  {id:'insurance', t:'She wanted the museum to get the insurance money.'},
  {id:'revenge', t:'She wanted revenge on Alexander.'},
  {id:'mistake', t:'She took it by mistake.'}
];

const LEVELS = {
  beginner:{
    label:'Beginner · A1–A2',
    story:[
      'Tonight is the opening night of the Aurora [diamond] [exhibition] at the City [museum]. The doors open at 8:00. At 8:20 the director, Alexander, looks at the [display case]. It is [empty]! The diamond is [gone].'
    ],
    mail:'Dear Detective, please help me. The diamond was in the case at 7:30. Only Alexander, Emily and Daniel have [keys] to the case. The [side door] was opened at 8:17. Please find the [thief]. — Alexander',
    notes:['Diamond in the case at <b>7:30</b>','Doors open at <b>8:00</b>','Side door opened at <b>8:17</b>','Case empty at <b>8:20</b>','Keys: <b>Alexander, Emily, Daniel</b>'],
    talk:{
      alexander:'I was in the main hall from eight o’clock. I gave a [speech] to the [guests]. At 8:20 I walked to the case, and it was empty.',
      emily:'At 8:10 I went to the [office] to get a display [label]. I stayed in the office until 8:25. I never went near the side door.',
      daniel:'First I checked the [main entrance]. I got to the side door at about 8:18. I saw a person in a [navy] [jacket] running into the [garden].'
    },
    q:{
      brief:[
        {type:'choice', p:'When was the diamond still in the case?', o:['At 7:30','At 8:17','At 8:20','At 9:00'], a:0, ex:'The email says: “The diamond was in the case at 7:30.”'},
        {type:'choice', p:'Who has keys to the case?', o:['All the guests','Only the director','Alexander, Emily and Daniel','Nobody'], a:2, ex:'“Only Alexander, Emily and Daniel have keys to the case.”'},
        {type:'tf', p:'The side door was opened at 8:17.', a:true, ex:'True — this is in Alexander’s email.'}

function glossify(text){ return esc(text).replace(/\[(.+?)\]/g,(m,w)=> GLOSS[w.toLowerCase()] ? `<span class="gw" data-w="${esc(w)}">${w}</span>` : w); }

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
let toastT; function toast(m){ let t=document.querySelector('.toast'); if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t);} t.textContent=m; clearTimeout(toastT); toastT=setTimeout(()=>t.remove(),2600); }

function beep(type){ if(!SOUND) return; try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const seq={ok:[[523,.09],[659,.09],[784,.18]],bad:[[220,.18],[175,.25]],tick:[[880,.04]],join:[[660,.06],[990,.1]],drum:[[110,.12],[110,.12],[110,.12],[82,.4]],ev:[[392,.08],[523,.08],[659,.08],[1046,.22]]}[type]||[];
  let t=AC.currentTime; seq.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.setValueAtTime(.16,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02);t+=d*.9;}); }catch(e){} }
function speak(text,pitch=1,rate=.9){ try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(plain(text)); const vs=speechSynthesis.getVoices(); const v=vs.find(v=>/en-GB/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang)); if(v)u.voice=v; u.lang='en-GB'; u.rate=rate; u.pitch=pitch; speechSynthesis.speak(u);}catch(e){} }
try{speechSynthesis.getVoices();}catch(e){}
function confetti(n=160){ const c=$('confetti'),x=c.getContext('2d'); c.width=innerWidth;c.height=innerHeight; const cols=['#e2be78','#e5484d','#3e8ef7','#2fbf71','#f5a524','#fff'];
  const P=Array.from({length:n},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,r:4+Math.random()*5,c:cols[Math.random()*cols.length|0],a:Math.random()*6}));
  let f=0;(function loop(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/2,p.r,p.r*.6);x.restore();});if(++f<240)requestAnimationFrame(loop);else x.clearRect(0,0,c.width,c.height);})(); }

/* =========================================================
   NETWORK  (PeerJS over the internet; BroadcastChannel with ?local for testing)
   ========================================================= */
const PREFIX='emystery-v1-';
function wrapPeerConn(c){ const h={data:[],close:[]}; c.on('data',d=>h.data.forEach(f=>f(d))); const cl=()=>h.close.forEach(f=>f()); c.on('close',cl); c.on('error',cl);
  return { send(d){ try{ if(c.open) c.send(d); }catch(e){} }, onData(f){h.data.push(f);}, onClose(f){h.close.push(f);}, close(){ try{c.close();}catch(e){} } }; }
const Net = {
  host(code, onConn){
    if(LOCAL){ return new Promise(res=>{ const bc=new BroadcastChannel(PREFIX+code), conns={};
      bc.onmessage=e=>{ const m=e.data; if(m.to!=='host') return;
        if(m.type==='hello'){ const h={data:[],close:[]}; const conn={send(d){bc.postMessage({to:m.from,type:'data',data:d});},onData(f){h.data.push(f);},onClose(f){h.close.push(f);},close(){},_h:h}; conns[m.from]=conn; bc.postMessage({to:m.from,type:'ok'}); onConn(conn); }
        else if(m.type==='data' && conns[m.from]) conns[m.from]._h.data.forEach(f=>f(m.data)); };
      res(); }); }
    return new Promise((res,rej)=>{ if(!window.Peer) return rej(new Error('nolib'));
      const peer=new Peer(PREFIX+code,{debug:0}); let opened=false;
      peer.on('open',()=>{opened=true;res(peer);});
      peer.on('error',e=>{ if(!opened) rej(e); });
      peer.on('disconnected',()=>{ try{peer.reconnect();}catch(e){} });
      peer.on('connection',c=>{ c.on('open',()=>onConn(wrapPeerConn(c))); }); });
  },
  join(code){
    if(LOCAL){ return new Promise((res,rej)=>{ const me=rid(), bc=new BroadcastChannel(PREFIX+code), h={data:[],close:[]}; let ok=false;
      bc.onmessage=e=>{ const m=e.data; if(m.to!==me) return; if(m.type==='ok'){ ok=true; res({send(d){bc.postMessage({to:'host',from:me,type:'data',data:d});},onData(f){h.data.push(f);},onClose(f){h.close.push(f);},close(){bc.close();}}); } else if(m.type==='data') h.data.forEach(f=>f(m.data)); };
      bc.postMessage({to:'host',from:me,type:'hello'}); setTimeout(()=>{ if(!ok) rej(new Error('notfound')); },1500); }); }
    return new Promise((res,rej)=>{ if(!window.Peer) return rej(new Error('nolib'));
      const peer=new Peer({debug:0}); let done=false; const fail=e=>{ if(!done){done=true; try{peer.destroy();}catch(_){} rej(e);} };
      peer.on('error',e=>fail(e.type==='peer-unavailable'?new Error('notfound'):e));
      peer.on('open',()=>{ const c=peer.connect(PREFIX+code,{reliable:true}); c.on('open',()=>{ done=true; res(wrapPeerConn(c)); }); setTimeout(()=>fail(new Error('timeout')),12000); }); });
  }
};

const STAGE_INFO = {
  brief:{ic:'📂',t:'Briefing',sub:'Read the case file together.'},
  talk:{ic:'🗣️',t:'Interrogation',sub:'Listen to the three suspects. Somebody is lying.'},
  duel:{ic:'⚔️',t:'Grammar Duel',sub:'If at least half of the class answers correctly, the evidence is unlocked.'},
  board:{ic:'📌',t:'Evidence Board',sub:'Look at the evidence. What really matters?'}
};
function buildSteps(level){
  const steps=[]; const Q=LEVELS[level].q; let n=0;
  ['brief','talk','duel','board'].forEach(st=>{ steps.push({k:'intro',st}); Q[st].forEach((q,i)=>{ steps.push({k:'q',st,i,n:n++}); steps.push({k:'reveal',st,i,n:n-1}); }); });
  steps.push({k:'vote'},{k:'verdict'},{k:'podium'});
  return steps;
}
function allQ(level){ const Q=LEVELS[level].q; return [...Q.brief,...Q.talk,...Q.duel,...Q.board]; }
function publicQ(q){ // what players receive (no answer)
  if(q.type==='order'){ const w=shuffle(q.w.slice()); if(w.join(' ')===q.w.join(' ')) w.reverse(); return {type:'order',p:q.p,w}; }
  return {type:q.type,p:q.p,o:q.type==='tf'?['True','False']:q.o};
}
function isRight(q,ans){ if(ans==null) return false; if(q.type==='order') return Array.isArray(ans)&&ans.join(' ')===q.w.join(' '); if(q.type==='tf') return (ans===0)===q.a; return ans===q.a; }
function rightIndex(q){ return q.type==='tf'?(q.a?0:1):q.a; }
function rightText(q){ return q.type==='order'?q.w.join(' '):q.type==='tf'?(q.a?'True':'False'):q.o[q.a]; }

/* =========================================================
   HOST
   ========================================================= */
const Host = {
  H:null, timer:null,
  setup(){
    const H=this.H={ code:null, players:{}, level:'beginner', qTime:20, step:-1, steps:[], answers:{}, qStart:0, evidence:[], votes:{}, lastGain:{}, lastRank:{} };
    this.newRoom();
  },
  async newRoom(tries=0){
    const H=this.H; H.code=String(Math.floor(10000+Math.random()*90000));
    this.render();
    try{ await Net.host(H.code, conn=>this.onConn(conn)); H.online=true; this.render(); }
    catch(e){ if(e && e.type==='unavailable-id' && tries<5) return this.newRoom(tries+1);
      H.netError = e && e.message==='nolib' ? 'Could not load the connection library. Check the internet.' : 'Could not create the room. Check the internet and reload the page.'; this.render(); }
  },
  onConn(conn){
    let pid=null;
    conn.onData(m=>{
      if(!m||!m.t) return;
      const H=this.H;
      if(m.t==='join'){
        pid=m.pid; const name=String(m.name||'Player').slice(0,16), av=AVATARS.includes(m.av)?m.av:'🦊';
        let p=H.players[pid];
        if(!p){ // same nickname taken by another device?
          if(Object.values(H.players).some(x=>x.name.toLowerCase()===name.toLowerCase())){ conn.send({t:'error',msg:'This name is already taken. Choose another one.'}); return; }
          p=H.players[pid]={pid,name,av,score:0,streak:0,correct:0};
          if(H.step<0) beep('join');
        }
        p.conn=conn; p.online=true; p.seen=Date.now();
        conn.send({t:'welcome',pid,name:p.name,av:p.av,score:p.score});
        this.sendState(p); this.render();
      } else if(!pid || !H.players[pid]) return;
      const p=H.players[pid]; p.seen=Date.now(); p.online=true;
      if(m.t==='answer') this.onAnswer(p,m);
      if(m.t==='vote') { const st=this.cur(); if(st&&st.k==='vote'){ H.votes[pid]={s:m.s,m:m.m}; this.render(); conn.send({t:'voted'}); } }
    });
    conn.onClose(()=>{ if(pid&&this.H.players[pid]){ this.H.players[pid].online=false; this.render(); } });
  },
  cur(){ return this.H.steps[this.H.step]; },
  list(){ return Object.values(this.H.players); },
  ranked(){ return this.list().sort((a,b)=>b.score-a.score); },
  rankOf(pid){ const r=this.ranked(); const p=this.H.players[pid]; return 1+r.findIndex(x=>x.score===p.score); },
  broadcast(){ this.list().forEach(p=>this.sendState(p)); },
  sendState(p){
    const H=this.H, st=this.cur(); if(!p.conn) return;
    if(!st){ p.conn.send({t:'state',k:'lobby'}); return; }
    const L=LEVELS[H.level];
    if(st.k==='intro'){
      const payload={t:'state',k:'intro',st:st.st,info:STAGE_INFO[st.st]};
      if(st.st==='brief') payload.text={story:L.story,mail:L.mail};
      if(st.st==='talk') payload.talk=SUSPECTS.map(s=>({id:s.id,name:s.name,role:s.role,text:L.talk[s.id]}));
      if(st.st==='board') payload.ev=EV_ORDER.filter(id=>H.evidence.includes(id)).map(id=>EVIDENCE[id]);
      p.conn.send(payload);
    } else if(st.k==='q'){
      const left=Math.max(0,H.qTime*1000-(Date.now()-H.qStart));
      p.conn.send({t:'state',k:'q',n:st.n,total:H.qTotal,q:H.pubQ,left,dur:H.qTime*1000,done:!!H.answers[p.pid]});
    } else if(st.k==='reveal'){
      const q=allQ(H.level)[st.n], a=H.answers[p.pid];
      p.conn.send({t:'state',k:'reveal',ok:!!(a&&a.ok),answered:!!a,gain:H.lastGain[p.pid]||0,score:p.score,rank:this.rankOf(p.pid),of:this.list().length,streak:p.streak,right:rightText(q),ex:q.ex});
    } else if(st.k==='vote'){
      p.conn.send({t:'state',k:'vote',done:!!H.votes[p.pid],sus:SUSPECTS.map(s=>({id:s.id,name:s.name,role:s.role})),mot:MOTIVES});
    } else if(st.k==='verdict'||st.k==='podium'){
      const v=H.votes[p.pid]||{};
      p.conn.send({t:'state',k:st.k,score:p.score,rank:this.rankOf(p.pid),of:this.list().length,thief:v.s==='emily',motive:v.m==='collector',gain:H.lastGain[p.pid]||0,confession:L.confession});
    }
  },
  start(){
    const H=this.H; if(!this.list().length) return;
    H.steps=buildSteps(H.level); H.qTotal=allQ(H.level).length; H.step=-1;
    this.list().forEach(p=>{p.score=0;p.streak=0;p.correct=0;}); H.evidence=[]; H.votes={};
    this.next();
  },
  next(){
    const H=this.H; clearInterval(this.timer); try{speechSynthesis.cancel();}catch(e){}
    if(H.step>=H.steps.length-1) return;
    H.step++; const st=this.cur();
    if(st.k==='q'){ H.answers={}; H.pubQ=publicQ(allQ(H.level)[st.n]); H.qStart=Date.now(); this.timer=setInterval(()=>this.tick(),250); }
    if(st.k==='reveal') this.score();
    if(st.k==='verdict'){ this.scoreVotes(); beep('drum'); setTimeout(()=>{beep('ok');confetti();},900); }
    if(st.k==='podium') setTimeout(()=>confetti(220),300);
    this.render(); this.broadcast();
    if(st.k==='intro' && st.st==='brief') setTimeout(()=>this.render(),50);
  },
  tick(){
    const H=this.H, left=H.qTime*1000-(Date.now()-H.qStart);
    const ring=$('ring'); if(ring){ const sec=Math.max(0,Math.ceil(left/1000)), C=2*Math.PI*64; ring.querySelector('.arc').setAttribute('stroke-dasharray',`${C*Math.max(0,left)/(H.qTime*1000)} ${C}`); const num=ring.querySelector('.num'); if(num.textContent!=String(sec)){ num.textContent=sec; if(sec<=5&&sec>0) beep('tick'); } ring.classList.toggle('low',sec<=5); }
    const online=this.list().filter(p=>p.online), done=online.length && online.every(p=>H.answers[p.pid]);
    if(left<=0 || done){ clearInterval(this.timer); setTimeout(()=>this.next(), done?600:0); }
  },
  onAnswer(p,m){
    const H=this.H, st=this.cur(); if(!st||st.k!=='q'||m.n!==st.n||H.answers[p.pid]) return;
    const q=allQ(H.level)[st.n], t=Date.now()-H.qStart; if(t>H.qTime*1000+1500) return;
    let ans=m.a; if(q.type==='order' && Array.isArray(ans)) ans=ans.map(String);
    H.answers[p.pid]={a:ans,t,ok:isRight(q,ans)};
    p.conn.send({t:'locked'});
    const el=$('answered'); if(el){ el.querySelector('.count').textContent=Object.keys(H.answers).length; }
  },
  score(){
    const H=this.H, st=this.cur(), q=allQ(H.level)[st.n]; H.lastGain={};
    H.lastRank={}; this.ranked().forEach((p,i)=>H.lastRank[p.pid]=i);
    let okCount=0;
    this.list().forEach(p=>{ const a=H.answers[p.pid];
      if(a&&a.ok){ okCount++; p.streak++; p.correct++; const speed=Math.max(0,1-a.t/(H.qTime*1000)); const g=Math.round(500+500*speed)+100*Math.min(Math.max(p.streak-1,0),3); p.score+=g; H.lastGain[p.pid]=g; }
      else p.streak=0; });
    const total=Object.keys(H.answers).length; H.okCount=okCount; H.totalAns=total;
    H.unlocked=null;
    if(q.ev){ const enough = this.list().length ? okCount/this.list().length>=0.5 : false; if(enough && !H.evidence.includes(q.ev)){ H.evidence.push(q.ev); H.unlocked=q.ev; setTimeout(()=>beep('ev'),300);} else if(!enough) H.unlocked='none'; }
    beep(okCount?'ok':'bad');
  },
  scoreVotes(){ const H=this.H; H.lastGain={}; this.list().forEach(p=>{ const v=H.votes[p.pid]; let g=0; if(v){ if(v.s==='emily') g+=1000; if(v.m==='collector') g+=500; } p.score+=g; H.lastGain[p.pid]=g; }); },

  /* ---------- host rendering ---------- */

      : `<div class="answers">${q.o.map((o,i)=>`<div class="ans" style="--c:${ACOL[i]}"><span class="sh">${SHAPES[i]}</span>${esc(o)}</div>`).join('')}</div>`;
    const qq=allQ(H.level)[st.n];
    return `<div class="qhost"><div class="card"><div class="kicker">${STAGE_INFO[st.st].ic} ${STAGE_INFO[st.st].t} · Question ${st.n+1} / ${H.qTotal}</div>
      ${qq.ev?`<p class="muted" style="margin:8px 0 0">🔒 Evidence at stake: <b style="color:var(--gold)">${EVIDENCE[qq.ev].t}</b></p>`:''}

      <div class="side-stat"><div class="card"><div class="ring" id="ring"><svg width="150" height="150"><circle cx="75" cy="75" r="64" stroke="rgba(255,255,255,.08)" stroke-width="10" fill="none"/><circle class="arc" cx="75" cy="75" r="64" stroke="var(--gold)" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="${C} ${C}"/></svg><div class="num">${H.qTime}</div></div></div>
      <div class="card answered" id="answered"><div class="count">${n}</div><div class="muted">of ${this.list().filter(p=>p.online).length} answered</div></div></div></div>`;

    if(q.type!=='order'){ const counts=pq.o.map((_,i)=>Object.values(H.answers).filter(a=>a.a===i).length), tot=Math.max(1,H.totalAns), ri=rightIndex(q);
      opts=`<div class="answers">${pq.o.map((o,i)=>`<div class="ans ${i===ri?'right':'dim'}" style="--c:${ACOL[i]};--w:${100*counts[i]/tot}%"><span class="sh">${i===ri?'✓':SHAPES[i]}</span>${esc(o)}<span class="cnt">${counts[i]}</span><span class="barfill"></span></div>`).join('')}</div>`; }

      <div class="row" style="justify-content:center;gap:28px;margin:20px 0">${SUSPECTS.map(s=>`<div style="text-align:center"><div style="width:120px">${portrait(s.id)}</div><b>${s.name}</b><div class="muted" style="font-size:13px">${s.role}</div></div>`).join('')}</div>
      <div class="count" style="color:var(--gold)">${n} / ${on}</div><div class="muted">votes</div></div>`;

const Player = {
  P:null, conn:null,
  joinScreen(err){
    const saved=store.get('em.player',{}); let spid=null; try{spid=sessionStorage.getItem('em.pid'); if(!spid){spid=rid(); sessionStorage.setItem('em.pid',spid);}}catch(e){spid=rid();}
    const P=this.P=this.P||{pid:spid, name:saved.name||'', av:saved.av||AVATARS[Math.random()*AVATARS.length|0], code:params.get('join')||''};
    $('app').innerHTML=`<div class="ph"><div style="text-align:center;margin:14px 0 18px"><div class="kicker">English Mystery · Battle</div><h1 class="serif" style="font-size:38px;margin:6px 0 0">Join the case</h1></div>
      <label class="lb">Game code</label><input class="txt" id="code" inputmode="numeric" maxlength="5" placeholder="12345" value="${esc(P.code)}" style="font-size:30px;letter-spacing:.2em;text-align:center;font-family:Fraunces,serif">
      <label class="lb">Your name</label><input class="txt" id="nm" maxlength="16" placeholder="Name" value="${esc(P.name)}">
      <label class="lb">Your detective</label><div class="avs">${AVATARS.map(a=>`<button class="${P.av===a?'on':''}" data-av="${a}">${a}</button>`).join('')}</div>
      <label class="lb">Translations</label><div class="seg"><button class="${lang===0?'on':''}" data-lg="0">Русский</button><button class="${lang===1?'on':''}" data-lg="1">Қазақша</button></div>
      <div class="err" id="err">${err?esc(err):''}</div>
      <button class="btn btn-gold" id="go" style="width:100%;font-size:20px;padding:16px;margin-top:8px">Join →</button></div>`;
    document.querySelectorAll('[data-av]').forEach(b=>b.onclick=()=>{P.av=b.dataset.av; P.code=$('code').value; P.name=$('nm').value; this.joinScreen();});
    document.querySelectorAll('[data-lg]').forEach(b=>b.onclick=()=>{lang=+b.dataset.lg; store.set('em.lang',lang); P.code=$('code').value; P.name=$('nm').value; this.joinScreen();});
    $('go').onclick=()=>this.connect();
  },
  async connect(silent){
    const P=this.P;
    if(!silent){ P.code=$('code').value.trim(); P.name=$('nm').value.trim(); }
    if(!/^\d{5}$/.test(P.code)) return this.joinScreen('Enter the 5-digit code from the big screen.');
    if(!P.name) return this.joinScreen('Write your name.');
    store.set('em.player',{name:P.name,av:P.av});
    if(!silent){ const g=$('go'); g.disabled=true; g.textContent='Connecting…'; }
    try{
      const c=await Net.join(P.code); this.conn=c; this.lost=false;
      c.onData(m=>this.onMsg(m)); c.onClose(()=>this.onLost());
      c.send({t:'join',pid:P.pid,name:P.name,av:P.av});
      clearInterval(this.hb); this.hb=setInterval(()=>c.send({t:'ping'}),5000);
    }catch(e){
      if(silent) return setTimeout(()=>this.connect(true),3000);
      this.joinScreen(e.message==='notfound'?'Game not found. Check the code.':e.message==='nolib'?'No internet connection.':'Could not connect. Try again.');
    }
  },
  onLost(){ if(this.lost) return; this.lost=true; clearInterval(this.hb); const b=document.createElement('div'); b.className='conn'; b.id='connbar'; b.textContent='Reconnecting…'; document.body.appendChild(b); setTimeout(()=>this.connect(true),1500); },
  onMsg(m){
    const P=this.P; const cb=$('connbar'); if(cb) cb.remove();
    if(m.t==='error'){ this.conn&&this.conn.close(); this.joinScreen(m.msg); return; }
    if(m.t==='welcome'){ P.name=m.name; P.av=m.av; P.score=m.score; return; }
    if(m.t==='locked'){ this.S.done=true; this.render(); return; }
    if(m.t==='voted'){ this.S.done=true; this.render(); return; }
    if(m.t==='state'){ this.S=m; if(m.score!=null) P.score=m.score; if(m.k==='lobby') P.score=0;
      if(m.k==='q'){ this.deadline=Date.now()+m.left; this.order=[]; this.pick=null; }
      if(m.k==='vote'){ this.vs=this.vs||{}; }
      if(m.k==='reveal'){ beep(m.ok?'ok':'bad'); if(navigator.vibrate) try{navigator.vibrate(m.ok?60:[60,60,60]);}catch(e){} if(m.ok) confetti(40); }
      if(m.k==='podium' && m.rank<=3) confetti(200);
      this.render(); }
  },
  top(){ const P=this.P; return `<div class="ph-top"><div class="me"><span class="av">${P.av}</span>${esc(P.name)}</div><div class="score-pill">${P.score||0}</div></div>`; },
  render(){
    const S=this.S, P=this.P; clearInterval(this.pt);
    let b='';
    if(!S||S.k==='lobby') b=`<div class="center"><div class="big">${P.av}</div><h2 class="serif">You're in!</h2><p class="muted">Look at the big screen. The game will start soon.</p></div>`;
    else if(S.k==='intro'){
      let t='';
      if(S.text) t=`<div class="ptext">${S.text.story.map(p=>`<p>${glossify(p)}</p>`).join('')}<p style="font-family:Inter;font-size:16px">${glossify(S.text.mail)}</p></div>`;
      if(S.talk) t=S.talk.map(s=>`<div class="susc" style="margin-bottom:10px"><div class="hd">${portrait(s.id)}<div><b>${s.name}</b><div class="muted" style="font-size:12px">${s.role}</div></div></div><p>“${glossify(s.text)}”</p></div>`).join('');
      if(S.ev) t=S.ev.length?S.ev.map(e=>`<div class="susc" style="margin-bottom:8px"><b>${e.ic} ${e.t}</b><p style="font-family:Inter;font-size:15px;margin-top:4px">${esc(e.d)}</p></div>`).join(''):'<p class="muted">No evidence was unlocked.</p>';
      b=`<div style="text-align:center;margin-bottom:12px"><div style="font-size:44px">${S.info.ic}</div><h2 class="serif" style="margin:4px 0">${S.info.t}</h2><p class="muted" style="margin:0">${S.info.sub}</p></div>${t}${t&&(S.text||S.talk)?'<p class="muted" style="font-size:13px;text-align:center">Tap gold words to see the translation.</p>':''}`;
    }
    else if(S.k==='q'){
      const q=S.q;
      if(S.done) b=`<div class="center"><div class="big">⏳</div><h2 class="serif">Answer locked!</h2><p class="muted">Wait for the others…</p></div>`;
      else {
        const opts = q.type==='order'
          ? `<div class="aline">${this.order.map((wi,k)=>`<button class="tile" data-un="${k}">${esc(q.w[wi])}</button>`).join('')}</div><div class="tiles">${q.w.map((w,i)=>`<button class="tile ${this.order.includes(i)?'used':''}" data-pl="${i}">${esc(w)}</button>`).join('')}</div><button class="btn btn-gold" id="send" style="width:100%;margin-top:16px;font-size:18px" ${this.order.length===q.w.length?'':'disabled'}>Send answer</button>`
          : `<div class="pans ${q.o.length>2&&q.o.every(o=>o.length<14)?'grid2':''}">${q.o.map((o,i)=>`<button class="pbtn" style="--c:${ACOL[i]}" data-ans="${i}"><span class="sh">${SHAPES[i]}</span>${esc(o)}</button>`).join('')}</div>`;
        b=`<div class="pbar"><i id="pbar"></i></div><div class="muted" style="font-size:13px;font-weight:700">Question ${S.n+1} / ${S.total}</div><div class="pq">${qPrompt(q.p)}</div>${opts}`;
      }
    }
    else if(S.k==='reveal'){
      b=`<div class="res ${S.ok?'ok':'bad'}" style="text-align:center"><div class="big" style="font-size:64px">${S.ok?'✅':S.answered?'❌':'⌛'}</div>
        <h2 class="serif" style="margin:8px 0">${S.ok?'Correct!':S.answered?'Not this time':'Too late!'}</h2>
        <div class="pts">${S.ok?'+'+S.gain:'+0'}</div>${S.ok&&S.streak>=2?`<div style="color:#ffb44d;font-weight:800">🔥 Streak ×${S.streak}</div>`:''}
        <div class="rk">You are #${S.rank} of ${S.of}</div>
        ${S.ok?'':`<div class="ex"><b>Right answer:</b> ${esc(S.right)}<br>${S.ex}</div>`}</div>`;
    }
    else if(S.k==='vote'){
      const v=this.vs;
      b = S.done ? `<div class="center"><div class="big">🗳️</div><h2 class="serif">Vote sent!</h2><p class="muted">Look at the big screen for the truth…</p></div>`
        : `<h2 class="serif" style="margin:0 0 4px">Who is the thief?</h2><p class="muted" style="margin:0 0 12px">+1000 for the right thief</p>
          <div class="psus">${S.sus.map(s=>`<button class="${v.s===s.id?'on':''}" data-vs="${s.id}">${portrait(s.id)}${s.name}</button>`).join('')}</div>
          <h3 class="serif" style="margin:18px 0 0">Why? <span class="muted" style="font-family:Inter;font-size:14px">+500</span></h3>
          <div class="pmot">${S.mot.map(m=>`<button class="${v.m===m.id?'on':''}" data-vm="${m.id}">${esc(m.t)}</button>`).join('')}</div>
          <button class="btn btn-gold" id="vote" style="width:100%;margin-top:16px;font-size:18px" ${v.s&&v.m?'':'disabled'}>Send my accusation</button>`;
    }
    else if(S.k==='verdict'){
      b=`<div class="center"><div style="width:150px;margin:0 auto" class="pt">${portrait('emily')}</div><h2 class="serif">Emily is guilty!</h2>
        <p style="font-size:18px">${S.thief?'✅ You found the thief':'❌ Wrong suspect'}<br>${S.motive?'✅ Right motive':'❌ Wrong motive'}</p>
        <div class="res-pts serif" style="font-size:40px;font-weight:800;color:var(--gold)">+${S.gain}</div><p class="muted">You are #${S.rank} of ${S.of}</p></div>`;
    }
    else if(S.k==='podium'){
      b=`<div class="center"><div class="big">${['🥇','🥈','🥉'][S.rank-1]||'🕵️'}</div><h2 class="serif">${S.rank===1?'Best detective!':`#${S.rank} of ${S.of}`}</h2><div class="serif" style="font-size:48px;font-weight:800;color:var(--gold)">${S.score}</div><p class="muted">points · Case closed</p></div>`;
    }
    $('app').innerHTML=`<div class="ph">${this.top()}${b}</div>`;
    this.bind();
    if(S&&S.k==='q'&&!S.done){ const upd=()=>{const el=$('pbar'); if(!el) return; const left=Math.max(0,this.deadline-Date.now()); el.style.width=(100*left/S.dur)+'%';}; upd(); this.pt=setInterval(upd,250); }
  },
  bind(){
    const S=this.S;
    document.querySelectorAll('[data-ans]').forEach(b=>b.onclick=()=>{ if(S.done) return; this.conn.send({t:'answer',n:S.n,a:+b.dataset.ans}); S.done=true; this.render(); });
    document.querySelectorAll('[data-pl]').forEach(b=>b.onclick=()=>{ this.order.push(+b.dataset.pl); this.render(); });
    document.querySelectorAll('[data-un]').forEach(b=>b.onclick=()=>{ this.order.splice(+b.dataset.un,1); this.render(); });
    const send=$('send'); if(send) send.onclick=()=>{ this.conn.send({t:'answer',n:S.n,a:this.order.map(i=>S.q.w[i])}); S.done=true; this.render(); };
    document.querySelectorAll('[data-vs]').forEach(b=>b.onclick=()=>{ this.vs.s=b.dataset.vs; this.render(); });
    document.querySelectorAll('[data-vm]').forEach(b=>b.onclick=()=>{ this.vs.m=b.dataset.vm; this.render(); });
    const vote=$('vote'); if(vote) vote.onclick=()=>{ this.conn.send({t:'vote',s:this.vs.s,m:this.vs.m}); };
  }
};

document.addEventListener('keydown',e=>{ if(!Host.H||e.target.tagName==='INPUT') return; if(e.key===' '||e.key==='Enter'){ e.preventDefault(); const st=Host.cur(); if(!st) Host.start(); else if(st.k!=='podium') Host.next(); } });
/* host: mark players offline if silent */
setInterval(()=>{ if(!Host.H) return; let ch=false; Object.values(Host.H.players).forEach(p=>{ const off=Date.now()-p.seen>15000; if(p.online&&off){p.online=false;ch=true;} }); if(ch&&!Host.cur()) Host.render(); },3000);

ba(255,107,107,.35)}\n.banner.steal{background:rgba(255,204,92,.1);border:1px solid rgba(255,204,92,.4)}\n.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}\n\n/* ---------- story ---------- */\n.story{font-family:Fraunces,serif;font-size:23px;line-height:1.7}\n.story p{margin:0 0 14px}\n.gw{border-bottom:2px dotted var(--gold);cursor:help;position:relative;color:#fff2d6}\n.gw:hover,.gw.open{background:rgba(226,190,120,.12);border-radius:4px}\n.tip{position:fixed;z-index:50;background:#fff7e6;color:#1b1406;border-radius:12px;padding:10px 14px;font-family:Inter,sans-serif;font-size:15px;box-shadow:0 12px 30px rgba(0,0,0,.4);pointer-events:none;max-width:260px}\n.tip b{display:block;font-size:16px}\n.tip span{color:#6b5530}\n.email{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:rgba(255,255,255,.03);font-family:Inter,sans-serif;font-size:18px;line-height:1.6}\n.email .hd{font-size:13px;color:var(--muted);margin-bottom:6px}\n.listen{display:inline-flex;align-items:center;gap:8px}\n\n/* ---------- suspects ---------- */\n.suspects{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}\n.sus{border-radius:18px;padding:14px;border:2px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);text-align:center;transition:.15s}\n.sus:hover{border-color:var(--gold)}\n.sus.sel{border-color:var(--gold);background:rgba(226,190,120,.08)}\n.sus svg{width:96px;height:96px;display:block;margin:0 auto 8px}\n.sus strong{display:block;font-size:18px}\n.sus span{font-size:13px;color:var(--muted)}\n.sus .seen{font-size:12px;color:var(--ok);margin-top:4px;display:block}\n.bubble{position:relative;background:#f8f1e1;color:#1b1406;border-radius:18px;padding:18px 20px;font-size:21px;line-height:1.55;font-family:Fraunces,serif;margin-top:6px;animation:rise .3s}\n.bubble::before{content:\"\";position:absolute;top:-10px;left:var(--x,50%);border:10px solid transparent;border-top:0;border-bottom-color:#f8f1e1}\n.bubble
