<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Mystery — Class Mode</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070b16; --panel:#0f172a; --panel2:#131d35; --line:rgba(226,190,120,.18);
  --gold:#e2be78; --gold2:#b8893f; --text:#eef1f7; --muted:#9aa6bd;
  --ok:#3ccf91; --bad:#ff6b6b; --warn:#ffcc5c;
  --t0:#ff6b6b; --t1:#4dabf7; --t2:#51cf66; --t3:#cc5de8;
  --r:18px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
body{background:radial-gradient(1200px 600px at 15% -10%,rgba(226,190,120,.10),transparent 60%),radial-gradient(900px 500px at 110% 10%,rgba(77,171,247,.08),transparent 60%),var(--bg);min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
.serif{font-family:Fraunces,Georgia,serif}
.wrap{max-width:1180px;margin:0 auto;padding:18px 18px 40px}
.kicker{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:700}
.muted{color:var(--muted)}
.card{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.01));border:1px solid var(--line);border-radius:var(--r);padding:22px}
.btn{border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:999px;padding:12px 22px;font-weight:600;transition:.15s}
.btn:hover{border-color:var(--gold);transform:translateY(-1px)}
.btn-gold{background:linear-gradient(180deg,#f0d394,#c99a4b);color:#1a1206;border:none;box-shadow:0 8px 24px rgba(226,190,120,.25)}
.btn-gold:hover{filter:brightness(1.06)}
.btn-sm{padding:8px 14px;font-size:14px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.hidden{display:none!important}

/* ---------- top bar ---------- */
.topbar{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:12px}
.brand .logo{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);display:grid;place-items:center;color:var(--gold);font-size:20px}
.brand h1{margin:0;font-size:20px;line-height:1.1}
.brand small{color:var(--muted);font-size:12px}
.tools{display:flex;gap:8px}
.icon-btn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.03);display:grid;place-items:center;font-size:18px}
.icon-btn.on{border-color:var(--gold);color:var(--gold)}

.scoreboard{display:grid;grid-template-columns:repeat(var(--n,2),1fr);gap:10px;margin-bottom:12px}
.team{position:relative;border-radius:16px;padding:12px 16px;border:2px solid transparent;background:rgba(255,255,255,.035);display:flex;align-items:center;justify-content:space-between;gap:10px;transition:.25s;overflow:hidden}
.team::before{content:"";position:absolute;inset:0 auto 0 0;width:6px;background:var(--c)}
.team .name{font-weight:700;font-size:16px;padding-left:6px}
.team .pts{font-family:Fraunces,serif;font-size:30px;font-weight:800}
.team.active{border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 18%,transparent)}
.team.active .name::after{content:" · your turn";font-weight:500;font-size:12px;color:var(--c)}
.team .plus{position:absolute;right:56px;top:8px;font-weight:800;color:var(--ok);opacity:0}
.team .plus.show{animation:plus 1.1s ease-out}
@keyframes plus{0%{opacity:0;transform:translateY(8px)}20%{opacity:1}100%{opacity:0;transform:translateY(-18px)}}

.track{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:16px}
.step{border-radius:12px;padding:10px 8px;text-align:center;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);color:var(--muted)}
.step .ic{display:block;font-size:20px;margin-bottom:2px}
.step.done{color:var(--gold);border-color:var(--line)}
.step.now{background:linear-gradient(180deg,#f0d394,#c99a4b);color:#1a1206;border-color:transparent}

/* ---------- layout ---------- */
.stage{display:grid;grid-template-columns:1fr 330px;gap:16px}
@media (max-width:900px){.stage{grid-template-columns:1fr}.track .lbl{display:none}}
@media (max-width:640px){.team.active .name::after{content:""}.team .pts{font-size:24px}.btn{white-space:nowrap}}
.side .card{padding:18px}
.side h3{margin:0 0 10px;font-size:16px}
.notes li{margin:6px 0;color:var(--muted);font-size:14px}
.notes b{color:var(--text)}

.q-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:12px}
.q-head h2{margin:4px 0 0;font-size:30px;line-height:1.15}
.turn-pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 50%,transparent)}
.turn-pill .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}

.timer{--p:1;position:relative;width:74px;height:74px;flex:none}
.timer svg{transform:rotate(-90deg)}
.timer .num{position:absolute;inset:0;display:grid;place-items:center;font-family:Fraunces,serif;font-size:24px;font-weight:800}
.timer.low .num{color:var(--bad)}
.timer.low{animation:pulse .8s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}

.prompt{font-size:26px;line-height:1.45;margin:10px 0 18px}
.prompt .blank{display:inline-block;min-width:90px;border-bottom:3px dashed var(--gold);text-align:center;color:var(--gold)}
.type-tag{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.options{grid-template-columns:1fr}.prompt{font-size:21px}.q-head h2{font-size:24px}}
.opt{display:flex;align-items:center;gap:14px;text-align:left;border-radius:16px;padding:18px;border:2px solid rgba(255,255,255,.08);background:rgba(255,255,255,.035);font-size:20px;font-weight:600;transition:.15s;min-height:72px}
.opt:hover:not(:disabled){border-color:var(--gold);transform:translateY(-2px)}
.opt .k{width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;font-size:15px;background:rgba(255,255,255,.07);color:var(--gold)}
.opt.right{border-color:var(--ok);background:rgba(60,207,145,.14)}
.opt.wrong{border-color:var(--bad);background:rgba(255,107,107,.12);opacity:.75}
.opt:disabled{cursor:default}
.opt.right .k{background:var(--ok);color:#04130c}
.opt.wrong .k{background:var(--bad);color:#200}

.tiles{display:flex;flex-wrap:wrap;gap:10px;min-height:64px}
.answer-line{border:2px dashed var(--line);border-radius:16px;padding:12px;margin-bottom:14px;min-height:68px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.answer-line:empty::before{content:"Tap the words in the right order…";color:var(--muted)}
.tile{border-radius:12px;padding:12px 16px;font-size:20px;font-weight:600;background:#1b2747;border:1px solid rgba(255,255,255,.1)}
.tile:hover{border-color:var(--gold)}
.tile.used{visibility:hidden}

.banner{margin-top:16px;border-radius:16px;padding:16px 18px;display:flex;gap:14px;align-items:flex-start;animation:rise .3s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.banner .big{font-size:28px;line-height:1}
.banner h4{margin:0 0 4px;font-size:18px}
.banner p{margin:0;color:#d5dbe7;line-height:1.5}
.banner.ok{background:rgba(60,207,145,.12);border:1px solid rgba(60,207,145,.4)}
.banner.bad{background:rgba(255,107,107,.1);border:1px solid rgba(255,107,107,.35)}
.banner.steal{background:rgba(255,204,92,.1);border:1px solid rgba(255,204,92,.4)}
.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}

/* ---------- story ---------- */
.story{font-family:Fraunces,serif;font-size:23px;line-height:1.7}
.story p{margin:0 0 14px}
.gw{border-bottom:2px dotted var(--gold);cursor:help;position:relative;color:#fff2d6}
.gw:hover,.gw.open{background:rgba(226,190,120,.12);border-radius:4px}
.tip{position:fixed;z-index:50;background:#fff7e6;color:#1b1406;border-radius:12px;padding:10px 14px;font-family:Inter,sans-serif;font-size:15px;box-shadow:0 12px 30px rgba(0,0,0,.4);pointer-events:none;max-width:260px}
.tip b{display:block;font-size:16px}
.tip span{color:#6b5530}
.email{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:rgba(255,255,255,.03);font-family:Inter,sans-serif;font-size:18px;line-height:1.6}
.email .hd{font-size:13px;color:var(--muted);margin-bottom:6px}
.listen{display:inline-flex;align-items:center;gap:8px}

/* ---------- suspects ---------- */
.suspects{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.sus{border-radius:18px;padding:14px;border:2px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);text-align:center;transition:.15s}
.sus:hover{border-color:var(--gold)}
.sus.sel{border-color:var(--gold);background:rgba(226,190,120,.08)}
.sus svg{width:96px;height:96px;display:block;margin:0 auto 8px}
.sus strong{display:block;font-size:18px}
.sus span{font-size:13px;color:var(--muted)}
.sus .seen{font-size:12px;color:var(--ok);margin-top:4px;display:block}
.bubble{position:relative;background:#f8f1e1;color:#1b1406;border-radius:18px;padding:18px 20px;font-size:21px;line-height:1.55;font-family:Fraunces,serif;margin-top:6px;animation:rise .3s}
.bubble::before{content:"";position:absolute;top:-10px;left:var(--x,50%);border:10px solid transparent;border-top:0;border-bottom-color:#f8f1e1}
.bubble .who{font-family:Inter,sans-serif;font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#8a6a2e;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.bubble .who button{border:none;background:#1b1406;color:#f8f1e1;border-radius:999px;padding:6px 12px;font-size:13px}

/* ---------- board ---------- */
.board{position:relative;border-radius:18px;padding:22px;min-height:360px;background:
 radial-gradient(circle at 20% 30%,rgba(0,0,0,.18) 0 2px,transparent 3px) 0 0/22px 22px,
 linear-gradient(135deg,#8a5a34,#6e4526);box-shadow:inset 0 0 0 10px #4a2e19,inset 0 0 40px rgba(0,0,0,.45)}
.board-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;position:relative;z-index:2}
@media (max-width:640px){.board-grid{grid-template-columns:1fr 1fr}}
.pin{position:relative;background:#fbf6ea;color:#2a1f10;border-radius:4px;padding:18px 14px 14px;box-shadow:0 10px 18px rgba(0,0,0,.35);transform:rotate(var(--rot,0deg));animation:drop .45s cubic-bezier(.2,1.6,.4,1)}
.pin::before{content:"";position:absolute;top:-8px;left:50%;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff8a8a,#c0262d);box-shadow:0 2px 3px rgba(0,0,0,.4)}
.pin .ico{font-size:30px}
.pin h5{margin:6px 0 4px;font-size:15px;font-family:Fraunces,serif}
.pin p{margin:0;font-size:13px;line-height:1.45;color:#4a3a22}
.pin.locked{background:rgba(255,255,255,.12);color:rgba(255,255,255,.65);box-shadow:none;border:2px dashed rgba(255,255,255,.35)}
.pin.locked p{color:rgba(255,255,255,.6)}
.pin.locked::before{background:#777}
@keyframes drop{from{opacity:0;transform:translateY(-30px) rotate(-12deg) scale(1.1)}}
svg.strings{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}

.mini-ev{display:flex;flex-direction:column;gap:8px}
.mini-ev .it{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.04);font-size:14px}
.mini-ev .it.lock{opacity:.4}

/* ---------- setup ---------- */
.hero{text-align:center;padding:26px 10px 10px}
.hero h1{font-size:clamp(42px,7vw,78px);margin:8px 0 0;line-height:.95;letter-spacing:.02em}
.hero h1 em{font-style:normal;background:linear-gradient(180deg,#f3d9a2,#b8893f);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);letter-spacing:.2em;text-transform:uppercase;font-size:13px}
.setup{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;margin-top:18px}
@media (max-width:900px){.setup{grid-template-columns:1fr}}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:8px;letter-spacing:.06em;text-transform:uppercase}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{border-radius:12px;padding:10px 16px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);font-weight:600}
.seg button.on{border-color:var(--gold);background:rgba(226,190,120,.14);color:var(--gold)}
.team-inputs{display:grid;gap:8px}
.team-inputs .ti{display:flex;align-items:center;gap:10px}
.team-inputs .sw{width:16px;height:16px;border-radius:50%;flex:none}
.team-inputs input{flex:1;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:11px 14px;color:var(--text);font:inherit;font-size:16px}
.how li{margin:8px 0;line-height:1.5;color:#cfd6e4}
.how b{color:var(--gold)}

/* ---------- accusation ---------- */
.acc-team{display:flex;align-items:center;gap:10px;margin:16px 0 8px;font-weight:700}
.motives{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:640px){.motives{grid-template-columns:1fr}}
.mot{text-align:left;border-radius:14px;padding:14px;border:2px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);font-size:16px}
.mot.sel{border-color:var(--gold);background:rgba(226,190,120,.1)}
.votes{display:flex;gap:6px;justify-content:center;margin-top:6px;min-height:14px}
.votes i{width:12px;height:12px;border-radius:50%;display:block}
.reveal{text-align:center;padding:10px}
.reveal .culprit{position:relative;display:inline-block}
.reveal .culprit svg{width:180px;height:180px}
.stamp{position:absolute;left:50%;top:80%;transform:translate(-50%,-50%) rotate(-14deg);border:5px solid var(--bad);color:var(--bad);font-family:Fraunces,serif;font-weight:800;font-size:40px;padding:2px 16px;border-radius:10px;letter-spacing:.1em;animation:stamp .5s cubic-bezier(.2,1.8,.4,1) both;animation-delay:.4s;background:rgba(7,11,22,.55)}
@keyframes stamp{from{opacity:0;transform:translate(-50%,-50%) rotate(-14deg) scale(2.4)}}
.confession{max-width:720px;margin:18px auto 0;font-family:Fraunces,serif;font-size:21px;line-height:1.6;font-style:italic;color:#f1e6cf}

/* ---------- final ---------- */
.podium{display:flex;justify-content:center;align-items:flex-end;gap:14px;margin:26px 0}
.pod{width:170px;text-align:center}
.pod .bar{border-radius:14px 14px 0 0;background:color-mix(in srgb,var(--c) 30%,#111a30);border:2px solid var(--c);display:grid;place-items:center;font-family:Fraunces,serif;font-size:34px;font-weight:800;animation:grow .7s ease-out both}
@keyframes grow{from{transform:scaleY(0);transform-origin:bottom}}
.pod .nm{font-weight:700;margin-bottom:8px}
.pod .medal{font-size:34px}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.word{border-radius:12px;padding:12px 14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07)}
.word b{display:block;color:var(--gold);font-size:17px}
.word span{font-size:14px;color:var(--muted)}

.confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#fff7e6;color:#1b1406;padding:12px 18px;border-radius:999px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.4);z-index:70;animation:rise .25s}
kbd{font-family:Inter,sans-serif;font-size:12px;border:1px solid rgba(255,255,255,.25);border-bottom-width:2px;border-radius:6px;padding:1px 6px;color:var(--text)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="tip" class="tip hidden"></div>
<canvas id="confetti" class="confetti"></canvas>

<script>
'use strict';
/* =========================================================
   DATA
   ========================================================= */
const TEAM_COLORS = ['var(--t0)','var(--t1)','var(--t2)','var(--t3)'];
const TEAM_DEFAULTS = ['Red Foxes','Blue Owls','Green Wolves','Purple Cats'];
const STAGES = [
  {id:'brief', ic:'📂', t:'Briefing', sub:'Read the case file. Tap gold words to see the translation.'},
  {id:'talk',  ic:'🗣️', t:'Interrogation', sub:'Listen to every suspect. Not every answer is true.'},
  {id:'duel',  ic:'⚔️', t:'Grammar Duel', sub:'Every correct answer unlocks a piece of evidence.'},
  {id:'board', ic:'📌', t:'Evidence Board', sub:'Connect the clues. Which evidence really matters?'},
  {id:'accuse',ic:'⚖️', t:'Accusation', sub:'Each team names the thief and the motive.'}
];

// Glossary: word -> [ru, kz]
const GLOSS = {
  'diamond':['бриллиант','гауһар'], 'exhibition':['выставка','көрме'], 'museum':['музей','мұражай'],
  'display case':['витрина','витрина'], 'empty':['пустой','бос'], 'gone':['исчез','жоқ болып кетті'],
  'thief':['вор','ұры'], 'keys':['ключи','кілттер'], 'side door':['боковая дверь','бүйір есік'],
  'suspect':['подозреваемый','күдікті'], 'evidence':['улики, доказательства','айғақ, дәлел'],
  'guard':['охранник','күзетші'], 'speech':['речь','сөз сөйлеу'], 'guests':['гости','қонақтар'],
  'office':['офис, кабинет','кеңсе'], 'label':['этикетка, табличка','жапсырма, белгі'],
  'navy':['тёмно-синий','қою көк'], 'jacket':['куртка','күртке'], 'garden':['сад','бақ'],
  'main entrance':['главный вход','басты кіреберіс'], 'keycard':['ключ-карта','кілт-карта'],
  'locker':['шкафчик','жеке шкаф'], 'collector':['коллекционер','коллекционер'],
  'badge':['бейдж','бейдж'], 'glass dust':['стеклянная пыль','шыны шаңы'], 'motive':['мотив','себеп, мотив'],
  'alibi':['алиби','алиби'], 'witness':['свидетель','куәгер'], 'claimed':['утверждал(а)','мәлімдеді'],
  'confirmed':['подтвердили','растады'], 'unveil':['представить, открыть','таныстыру, ашу'],
  'disappeared':['исчез','жоғалып кетті'], 'access':['доступ','кіру мүмкіндігі'],
  'insisted':['настаивал(а)','табанды түрде айтты'], 'rushing':['спешащий, бегущий','асығып жүгірген']
};

const EVIDENCE = {
  keycard:{ic:'💳', t:'Keycard Log', d:'Emily’s staff keycard opened the side exit at 8:17.'},
  badge:{ic:'🪪', t:'Visitor Badge', d:'Emily’s badge was found on the ground just outside the side exit.'},
  jacket:{ic:'🧥', t:'Navy Jacket', d:'A navy jacket with glass dust in the pocket was in Emily’s locker.'},
  collector:{ic:'✉️', t:'Collector Message', d:'Emily wrote to a private collector about “a rare stone” last week.'},
  patrol:{ic:'🔦', t:'Patrol Log', d:'Daniel checked the main entrance first and reached the side door at 8:18.'},
  camera:{ic:'📹', t:'Camera Record', d:'The hall camera was turned toward the entrance, not the display case.'}
};
const EV_ORDER = ['keycard','badge','jacket','collector','patrol','camera'];

const SUSPECTS = [
  {id:'alexander', name:'Alexander', role:'Museum Director', pitch:.85},
  {id:'emily', name:'Emily', role:'Museum Assistant', pitch:1.25},
  {id:'daniel', name:'Daniel', role:'Security Guard', pitch:.7}
];
const MOTIVES = [
  {id:'collector', t:'She planned to sell the diamond to a private collector.'},
  {id:'insurance', t:'She wanted the museum to get the insurance money.'},
  {id:'revenge', t:'She wanted revenge on Alexander.'},
  {id:'mistake', t:'She took it by mistake.'}
];

const LEVELS = {
  beginner:{
    label:'Beginner · A1–A2',
    story:[
      'Tonight is the opening night of the Aurora [diamond] [exhibition] at the City [museum]. The doors open at 8:00. At 8:20 the director, Alexander, looks at the [display case]. It is [empty]! The diamond is [gone].'

/* =========================================================
   SOUND + SPEECH
   ========================================================= */
let AC=null;
function beep(type){
  if(!S.sound) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const seq = {ok:[[523,.09],[659,.09],[784,.18]], bad:[[220,.18],[175,.25]], tick:[[880,.04]], ev:[[392,.08],[523,.08],[659,.08],[1046,.22]], drum:[[110,.12],[110,.12],[110,.12],[82,.4]]}[type]||[];
    let t = AC.currentTime;
    seq.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type==='drum'?'triangle':'sine';o.frequency.value=f;g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02);t+=d*.9;});
  }catch(e){}
}
function speak(text,pitch=1){
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/\[|\]/g,''));
    const v = speechSynthesis.getVoices().find(v=>/en-GB/i.test(v.lang)) || speechSynthesis.getVoices().find(v=>/^en/i.test(v.lang));
    if(v) u.voice=v; u.lang='en-GB'; u.rate=S.level==='beginner'?.82:.95; u.pitch=pitch;
    speechSynthesis.speak(u);
  }catch(e){ toast('Speech is not available in this browser'); }
}
try{ speechSynthesis.getVoices(); }catch(e){}

/* =========================================================
   TEXT HELPERS
   ========================================================= */
function glossify(text){
  return esc(text).replace(/\[(.+?)\]/g,(m,w)=>{
    const g = GLOSS[w.toLowerCase()];
    return g ? `<span class="gw" data-w="${esc(w)}">${w}</span>` : w;
  });
}
const plain = t => t.replace(/\[|\]/g,'');
function usedWords(){
  const all = [ ...L().story, L().mail, ...Object.values(L().talk) ].join(' ');
  const seen=[]; all.replace(/\[(.+?)\]/g,(m,w)=>{w=w.toLowerCase(); if(GLOSS[w]&&!seen.includes(w)) seen.push(w);});
  return seen;
}

/* =========================================================
   TIMER
   ========================================================= */
let timerId=null, timeLeft=0;
function startTimer(){
  stopTimer();
  if(!S.timerSec) return;
  timeLeft=S.timerSec; drawTimer();
  timerId=setInterval(()=>{
    timeLeft--; if(timeLeft<=5 && timeLeft>0) beep('tick');
    drawTimer();
    if(timeLeft<=0){ stopTimer(); answer(null); }
  },1000);
}
function stopTimer(){ clearInterval(timerId); timerId=null; }
function drawTimer(){
  const el=$('timer'); if(!el) return;
  const p = Math.max(0,timeLeft/S.timerSec), C=2*Math.PI*31;
  el.querySelector('.arc').setAttribute('stroke-dasharray',`${C*p} ${C}`);
  el.querySelector('.num').textContent=timeLeft;
  el.classList.toggle('low',timeLeft<=5);
}
function timerHtml(){
  if(!S.timerSec) return '';
  return `<div class="timer" id="timer"><svg width="74" height="74"><circle cx="37" cy="37" r="31" stroke="rgba(255,255,255,.08)" stroke-width="6" fill="none"/><circle class="arc" cx="37" cy="37" r="31" stroke="var(--gold)" stroke-width="6" fill="none" stroke-linecap="round"/></svg><div class="num">${S.timerSec}</div></div>`;
}

function render(){
  hideTip();
  const app=$('app');
  if(S.screen==='setup'){ app.innerHTML=setupHtml(); return; }
  if(S.screen==='final'){ app.innerHTML=topbar()+finalHtml(); confetti(); return; }
  const st=STAGES[S.stage];
  let main='';
  if(st.id==='accuse') main=accuseHtml();
  else if(S.qi<0) main=introHtml(st);
  else main=questionHtml(st);
  app.innerHTML = topbar()+scoreboard()+track()+`<div class="stage"><main class="card">${main}</main>${sidePanel()}</div>`;
  if(st.id!=='accuse' && S.qi>=0 && !S.answered) startTimer(); else stopTimer();
}

}

function boardHtml(withStrings){
  const rots=[-3,2,-1.5,3,-2.5,1.5];
  const pins = EV_ORDER.map((id,i)=>{
    const on=S.evidence.includes(id), e=EVIDENCE[id];
    return `<div class="pin ${on?'':'locked'}" style="--rot:${rots[i]}deg" data-pin="${id}"><div class="ico">${on?e.ic:'🔒'}</div><h5>${on?e.t:'Locked'}</h5><p>${on?esc(e.d):'Win a duel question to unlock.'}</p></div>`;
  }).join('');
  return `<div class="board" id="board"><svg class="strings" id="strings"></svg><div class="board-grid">${pins}</div></div>`;
}
function drawStrings(){
  const svg=$('strings'), b=$('board'); if(!svg||!b) return;
  const on=[...b.querySelectorAll('.pin:not(.locked)')]; const br=b.getBoundingClientRect();
  const pts=on.map(p=>{const r=p.getBoundingClientRect();return [r.left-br.left+r.width/2, r.top-br.top+4];});
  let d=''; for(let i=1;i<pts.length;i++) d+=`<line x1="${pts[i-1][0]}" y1="${pts[i-1][1]}" x2="${pts[i][0]}" y2="${pts[i][1]}" stroke="#d6333b" stroke-width="2.5" opacity=".85"/>`;
  svg.innerHTML=d;
}

/* =========================================================
   QUESTIONS
   ========================================================= */
function curQ(){ return L().q[STAGES[S.stage].id][S.qi]; }
function qCount(){ return L().q[STAGES[S.stage].id].length; }
function teamNow(){ return S.stealing ? (S.turn+1)%S.teamCount : S.turn; }

function questionHtml(st){
  const q=curQ(), t=teamNow();
  const tag={choice:'Choose the answer',tf:'True or false?',order:'Put the words in order'}[q.type];
  let body='';
  if(q.type==='choice'||q.type==='tf'){
    const opts = q.type==='tf'?['True','False']:q.o;
    const right = q.type==='tf' ? (q.a?0:1) : q.a;
    body = `<div class="options">${opts.map((o,i)=>{
      let cls=''; if(S.tried.includes(i)) cls='wrong'; if(S.answered && i===right) cls='right';
      const dis = S.answered || S.tried.includes(i);
      return `<button class="opt ${cls}" data-a="opt" data-v="${i}" ${dis?'disabled':''}><span class="k">${cls==='right'?'✓':cls==='wrong'?'✗':i+1}</span>${esc(o)}</button>`;}).join('')}</div>`;
  } else {
    const placed=S.order;
    body = `<div class="answer-line" id="aline">${placed.map((wi,k)=>`<button class="tile" data-a="unplace" data-v="${k}">${esc(S.shuffled[wi])}</button>`).join('')}</div>
      <div class="tiles">${S.shuffled.map((w,i)=>`<button class="tile ${placed.includes(i)?'used':''}" data-a="place" data-v="${i}" ${S.answered?'disabled':''}>${esc(w)}</button>`).join('')}</div>
      ${S.answered?'':`<div class="actions" style="justify-content:flex-start"><button class="btn btn-sm" data-a="clear">↺ Clear</button><button class="btn btn-gold btn-sm" data-a="check" ${placed.length===q.w.length?'':'disabled style="opacity:.45"'}>Check</button></div>`}`;
  }
  const evLine = q.ev && !S.answered ? `<p class="muted" style="margin:-6px 0 14px">🔒 Prize: <b style="color:var(--gold)">${EVIDENCE[q.ev].t}</b></p>`:'';
  const prompt = esc(q.p).replace(/___/g,'<span class="blank">?</span>');
  return `<div class="q-head"><div>
      <div class="kicker">Stage ${S.stage+1} · ${st.t} · Question ${S.qi+1} / ${qCount()}</div>
      <div style="margin-top:10px"><span class="turn-pill" style="--c:${tc(t)}"><span class="dot"></span>${S.stealing?'STEAL! ':''}${esc(teams()[t].name)}</span></div>
    </div>${S.answered?'':timerHtml()}</div>
    <div class="type-tag">${tag}</div>
    <div class="prompt">${prompt}</div>${evLine}
    ${body}
    ${feedbackHtml()}`;
}

function feedbackHtml(){
  if(S.attempt==='steal-offer'){
    const n=(S.turn+1)%S.teamCount;
    return `<div class="banner steal"><div class="big">⚡</div><div><h4>Not quite! Steal chance for ${esc(teams()[n].name)}</h4><p>Try one of the remaining answers for <b>+5</b>.</p></div></div>`;
  }
  if(!S.answered) return '';
  const q=curQ(), ok=S.attempt==='ok';
  const ev = ok && q.ev ? `<p style="margin-top:8px">🔓 New evidence unlocked: <b>${EVIDENCE[q.ev].ic} ${EVIDENCE[q.ev].t}</b></p>`:'';
  const head = ok ? (S.lastWinner!=null?`Correct! +${S.lastPts} for ${esc(teams()[S.lastWinner].name)}`:'Correct!') : (S.attempt==='timeout'?'Time is up!':'No points this time');
  const model = q.type==='order' ? `<p><b>Answer:</b> ${esc(q.w.join(' '))}</p>`:'';
  const last = S.qi===qCount()-1;
  return `<div class="banner ${ok?'ok':'bad'}"><div class="big">${ok?'✅':'📘'}</div><div><h4>${head}</h4>${model}<p>${q.ex}</p>${ev}</div></div>
   <div class="actions"><button class="btn btn-gold" data-a="next">${last?'Next stage →':'Next question →'}</button></div>`;
}

function prepQ(){
  S.answered=false; S.attempt=null; S.stealing=false; S.tried=[]; S.order=[]; S.lastWinner=null;
  const q=curQ(); if(q && q.type==='order'){ S.shuffled=shuffle(q.w.slice()); if(S.shuffled.join(' ')===q.w.join(' ')) S.shuffled.reverse(); }
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function answer(choice){
  if(S.answered) return;
  stopTimer();
  const q=curQ();
  let ok=false;
  if(choice!==null){
    if(q.type==='order') ok = S.order.map(i=>S.shuffled[i]).join(' ')===q.w.join(' ');
    else if(q.type==='tf') ok = (choice===0)===q.a;
    else ok = choice===q.a;
  }
  if(ok){
    const t=teamNow(), pts=S.stealing?5:10;
    award(t,pts); S.lastWinner=t; S.lastPts=pts;
    S.answered=true; S.attempt='ok';
    if(q.ev && !S.evidence.includes(q.ev)){ S.evidence.push(q.ev); setTimeout(()=>beep('ev'),350); }
    beep('ok'); burst();
  } else {
    beep('bad');
    if(choice!==null && q.type!=='order') S.tried.push(choice);
    const optsLeft = q.type==='tf'?0 : q.type==='order'?1 : (q.o.length-S.tried.length-1);
    if(!S.stealing && S.teamCount>1 && optsLeft>0){
      S.stealing=true; S.attempt='steal-offer';
      if(q.type==='order') S.order=[];
    } else { S.answered=true; S.attempt = choice===null?'timeout':'bad'; }
  }
  render();
}
function award(t,pts){
  S.teams[t].score+=pts; S.teams[t].right++;
  setTimeout(()=>{const p=$('plus'+t); if(p){p.textContent='+'+pts;p.classList.remove('show');void p.offsetWidth;p.classList.add('show');}},30);
}
function next(){
  S.turn=(S.turn+1)%S.teamCount;
  if(S.qi < qCount()-1){ S.qi++; prepQ(); }
  else { S.stage++; S.qi=-1; S.suspectOpen=null; if(STAGES[S.stage].id==='accuse'){S.accuseTeam=0;S.accuse={};S.revealed=false;} }
  render();
}

/* =========================================================
   ACCUSATION
   ========================================================= */
function accuseHtml(){
  if(S.revealed) return revealHtml();
  const t=S.accuseTeam, cur=S.accuse[t]||{};
  const done = teams().every((_,i)=>S.accuse[i]&&S.accuse[i].s&&S.accuse[i].m);
  const votes = sid => teams().map((x,i)=>S.accuse[i]&&S.accuse[i].s===sid&&i!==t?`<i style="background:${tc(i)}"></i>`:'').join('');
  return `<div class="q-head"><div><div class="kicker">Stage 5 · Accusation</div><h2 class="serif">⚖️ Who stole the diamond?</h2><p class="muted" style="margin:6px 0 0">Each team discusses for one minute, then chooses a suspect and a motive.</p></div></div>
    <div class="row">${teams().map((x,i)=>`<button class="turn-pill" style="--c:${tc(i)};${i===t?'':'opacity:.5'}" data-a="acct" data-v="${i}"><span class="dot"></span>${esc(x.name)} ${S.accuse[i]&&S.accuse[i].s&&S.accuse[i].m?'✓':''}</button>`).join('')}</div>
    <div class="acc-team"><span class="turn-pill" style="--c:${tc(t)}"><span class="dot"></span>${esc(teams()[t].name)}</span> chooses:</div>
    <div class="suspects">${SUSPECTS.map(s=>`<button class="sus ${cur.s===s.id?'sel':''}" data-a="pick-s" data-v="${s.id}">${portrait(s.id)}<strong>${s.name}</strong><span>${s.role}</span><div class="votes">${votes(s.id)}</div></button>`).join('')}</div>
    <div class="type-tag" style="margin:8px 0">Motive — why did she / he do it?</div>
    <div class="motives">${MOTIVES.map(m=>`<button class="mot ${cur.m===m.id?'sel':''}" data-a="pick-m" data-v="${m.id}">${esc(m.t)}</button>`).join('')}</div>
    <div class="actions">${cur.s&&cur.m&&!done?`<button class="btn btn-gold" data-a="acc-next">Next team →</button>`:''}
      ${done?`<button class="btn btn-gold" data-a="reveal">🥁 Reveal the truth</button>`:''}</div>`;
}
function revealHtml(){
  const res = teams().map((x,i)=>{const a=S.accuse[i]||{};return {i,s:a.s==='emily',m:a.m==='collector'};});
  return `<div class="reveal"><div class="kicker">The truth</div>
    <div class="culprit" style="margin-top:12px">${portrait('emily')}<div class="stamp">GUILTY</div></div>
    <h2 class="serif" style="font-size:34px;margin:8px 0 0">Emily, the Museum Assistant</h2>
    <p class="muted">Motive: she planned to sell the diamond to a private collector.</p>
    <div class="confession">${esc(L().confession)}</div>
    <div class="row" style="justify-content:center;margin:16px 0 0"><button class="btn btn-sm" data-a="saytext">🔊 Listen to the confession</button></div>
    <div class="row" style="justify-content:center;margin-top:18px">${res.map(r=>`<div class="team" style="--c:${tc(r.i)};min-width:200px"><span class="name">${esc(teams()[r.i].name)}</span><span>${r.s?'✓ thief +30':'✗ thief'} · ${r.m?'✓ motive +10':'✗ motive'}</span></div>`).join('')}</div>
    <div class="actions" style="justify-content:center"><button class="btn btn-gold" data-a="final">See the final results →</button></div></div>`;
}

/* =========================================================
   FINAL
   ========================================================= */
function finalHtml(){
  const ranked = teams().map((t,i)=>({...t,i})).sort((a,b)=>b.score-a.score);
  const order = ranked.length>=3 ? [ranked[1],ranked[0],ranked[2]] : [ranked[1],ranked[0]].filter(Boolean);
  const max = Math.max(1,...ranked.map(r=>r.score));
  const place = r => ranked.findIndex(x=>x.score===r.score);
  const medal = r => ['🥇','🥈','🥉','🏅'][place(r)];
  const winners = ranked.filter(r=>r.score===ranked[0].score).map(r=>esc(r.name)).join(' & ');
  const rest = ranked.slice(3);
  return `<div class="hero" style="padding-top:6px"><div class="kicker">Case closed</div><h1 class="serif" style="font-size:clamp(34px,6vw,52px)"><em>${winners}</em></h1><p>${winners.includes('&')?'A draw! Best detectives of the day':'Best detectives of the day'}</p></div>
    <div class="podium">${order.map(r=>`<div class="pod" style="--c:${tc(r.i)}"><div class="medal">${medal(r)}</div><div class="nm">${esc(r.name)}</div><div class="bar" style="height:${60+150*r.score/max}px">${r.score}</div></div>`).join('')}</div>
    ${rest.length?`<p class="muted" style="text-align:center">${rest.map(r=>`${medal(r)} ${esc(r.name)} — ${r.score}`).join(' · ')}</p>`:''}
    <div class="card" style="margin-top:18px"><div class="kicker" style="margin-bottom:10px">Words of the case · ${S.lang===0?'Русский':'Қазақша'}</div>
      <div class="words">${usedWords().map(w=>`<div class="word"><b>${w}</b><span>${GLOSS[w][S.lang]}</span></div>`).join('')}</div></div>
    <div class="actions" style="justify-content:center;margin-top:20px"><button class="btn" data-a="home">Change teams</button><button class="btn btn-gold" data-a="again">Play again</button></div>`;
}

/* =========================================================
   FX
   ========================================================= */
let toastT;
function toast(m){ let t=document.querySelector('.toast'); if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t);} t.textContent=m; clearTimeout(toastT); toastT=setTimeout(()=>t.remove(),2200); }
function confetti(n=160){
  const c=$('confetti'), x=c.getContext('2d'); c.width=innerWidth; c.height=innerHeight;
  const cols=['#e2be78','#ff6b6b','#4dabf7','#51cf66','#cc5de8','#fff'];
  const P=Array.from({length:n},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,r:4+Math.random()*5,c:cols[Math.random()*cols.length|0],a:Math.random()*6}));
  let f=0; (function loop(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/2,p.r,p.r*.6);x.restore();}); if(++f<240) requestAnimationFrame(loop); else x.clearRect(0,0,c.width,c.height);})();
}
function burst(){ confetti(50); }

/* tooltip for glossary words */
function showTip(el){
  const w=el.dataset.w.toLowerCase(), g=GLOSS[w]; if(!g) return;
  const tip=$('tip'); tip.innerHTML=`<b>${esc(el.dataset.w)}</b><span>${g[S.lang]}</span>`; tip.classList.remove('hidden');
  const r=el.getBoundingClientRect(); const tw=tip.offsetWidth;
  tip.style.left=Math.max(8,Math.min(innerWidth-tw-8,r.left+r.width/2-tw/2))+'px'; tip.style.top=(r.top-tip.offsetHeight-10)+'px';
  document.querySelectorAll('.gw.open').forEach(x=>x.classList.remove('open')); el.classList.add('open');
}
function hideTip(){ $('tip').classList.add('hidden'); document.querySelectorAll('.gw.open').forEach(x=>x.classList.remove('open')); }

/* =========================================================
   EVENTS
   ========================================================= */
document.addEventListener('mouseover',e=>{const g=e.target.closest('.gw'); if(g) showTip(g);});
document.addEventListener('mouseout',e=>{if(e.target.closest('.gw')) hideTip();});
addEventListener('scroll',hideTip,{passive:true});
document.addEventListener('input',e=>{ if(e.target.dataset.team!=null){ S.teams[+e.target.dataset.team].name=e.target.value||TEAM_DEFAULTS[+e.target.dataset.team]; } });

document.addEventListener('click',e=>{
  const g=e.target.closest('.gw'); if(g){ showTip(g); speak(g.dataset.w); return; }
  const b=e.target.closest('[data-a]'); if(!b) return;
  const a=b.dataset.a, v=b.dataset.v;
  const q = S.screen==='game' && S.qi>=0 && STAGES[S.stage].id!=='accuse' ? curQ() : null;
  switch(a){
    case 'lvl': S.level=v; render(); break;
    case 'tn': S.teamCount=+v; render(); break;
    case 'tm': S.timerSec=+v; render(); break;
    case 'lg': S.lang=+v; render(); break;
    case 'lang': S.lang=1-S.lang; render(); toast(S.lang?'Аударма: қазақша':'Перевод: русский'); break;
    case 'sound': S.sound=!S.sound; render(); break;
    case 'full': try{ document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>toast('Full screen is blocked here')); }catch(err){toast('Full screen is blocked here');} break;
    case 'home': stopTimer(); try{speechSynthesis.cancel();}catch(_){} S.screen='setup'; render(); break;
    case 'start': case 'again': startGame(); break;
    case 'readall': speak(L().story.join(' ')+' '+L().mail); break;
    case 'sus': S.suspectOpen=v; S.heard[v]=true; render(); speak(L().talk[v], SUSPECTS.find(s=>s.id===v).pitch); break;
    case 'say': speak(L().talk[v], SUSPECTS.find(s=>s.id===v).pitch); break;
    case 'saytext': speak(L().confession, 1.25); break;
    case 'begin': if(b.disabled) return; try{speechSynthesis.cancel();}catch(_){} S.qi=0; prepQ(); render(); break;
    case 'opt': answer(+v); break;
    case 'place': if(!S.order.includes(+v)){S.order.push(+v); render();} break;
    case 'unplace': S.order.splice(+v,1); render(); break;
    case 'clear': S.order=[]; render(); break;
    case 'check': if(q && S.order.length===q.w.length) answer(0); break;
    case 'next': next(); break;
    case 'acct': S.accuseTeam=+v; render(); break;
    case 'pick-s': (S.accuse[S.accuseTeam]=S.accuse[S.accuseTeam]||{}).s=v; render(); break;
    case 'pick-m': (S.accuse[S.accuseTeam]=S.accuse[S.accuseTeam]||{}).m=v; render(); break;
    case 'acc-next': { const nxt=teams().findIndex((_,i)=>!(S.accuse[i]&&S.accuse[i].s&&S.accuse[i].m)); S.accuseTeam=nxt<0?S.accuseTeam:nxt; render(); break; }
    case 'reveal': beep('drum'); setTimeout(()=>{ teams().forEach((_,i)=>{const r=S.accuse[i]; let p=0; if(r.s==='emily')p+=30; if(r.m==='collector')p+=10; if(p){S.teams[i].score+=p;}}); S.revealed=true; render(); confetti(); beep('ok'); },900); break;
    case 'final': S.screen='final'; render(); break;
  }
  if(document.getElementById('board')) setTimeout(drawStrings,520);
});
addEventListener('resize',()=>{ if($('board')) drawStrings(); });
document.addEventListener('keyup',()=>{ if($('board')) setTimeout(drawStrings,520); });

document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT') return;
  if(S.screen!=='game') return;
  const st=STAGES[S.stage];
  if(/^[1-4]$/.test(e.key) && S.qi>=0 && st.id!=='accuse' && !S.answered){
    const q=curQ(); if(q.type==='order') return;
    const i=+e.key-1, n=q.type==='tf'?2:q.o.length; if(i<n && !S.tried.includes(i)) answer(i);
  } else if(e.key===' '||e.key==='Enter'){
    e.preventDefault();
    if(S.answered) next(); else if(S.qi<0 && st.id!=='accuse'){ const btn=document.querySelector('[data-a="begin"]'); if(btn && !btn.disabled) btn.click(); }
  } else if(e.key.toLowerCase()==='l'){
    if(st.id==='brief'&&S.qi<0) speak(L().story.join(' ')+' '+L().mail);
    else if(st.id==='talk'&&S.suspectOpen) speak(L().talk[S.suspectOpen]);
    else if(S.qi>=0 && st.id!=='accuse') speak(plain(curQ().p).replace(/___/g,'blank'));
  }
});

function startGame(){
  S.teams.forEach(t=>{t.score=0;t.right=0;});
  Object.assign(S,{screen:'game',stage:0,qi:-1,turn:0,evidence:[],suspectOpen:null,heard:{},accuse:{},accuseTeam:0,revealed:false});
  render();
}
render();
</script>
</body>
</html>
